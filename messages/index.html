<!DOCTYPE html>
<html lang="en" class="ch-ui ch-refresh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Messages</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/design.css">
    <link rel="stylesheet" href="/design-extra.css">
    <script src="/theme.js"></script>

    <script src="/pwa.js" defer></script>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="../passwords.js"></script>
    <script src="../auth-gate.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
    <link rel="stylesheet" href="/settings/settings.css">
    <link rel="stylesheet" href="/robot.css">
    <style>
        #main > .card { padding: 14px 16px 10px; }
        #main > .card h2 { margin: 4px 4px 4px; }
        .dm-row { display: flex; align-items: center; gap: 12px; padding: 10px 8px; margin: 0 -8px; min-height: 68px; text-decoration: none; color: inherit; border-top: 1px solid var(--ch-line); border-radius: var(--ch-r-sm); transition: background-color var(--ch-dur-1) ease; -webkit-tap-highlight-color: transparent; }
        .dm-row:hover { background: color-mix(in srgb, var(--ch-surface-2) 70%, transparent); }
        .dm-row:focus-visible { outline: none; box-shadow: var(--ch-focus); }
        .dm-row:first-of-type, h2 + .dm-row { border-top: 0; }
        .dm-row > .ch-ic { color: var(--ch-faint); flex: none; }
        .dm-av { width: 46px; height: 46px; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; color: #fff; flex-shrink: 0; background: #6b7280;
            background-image: linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,0) 60%); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.1); }
        .dm-av svg { width: 24px; height: 24px; }
        .dm-av.ai { background-color: var(--ai-acc, #7c3aed); padding: 6px; }
        .dm-av.ai .bob-face { color: #f5f3ff; }
        .dm-main { flex: 1; min-width: 0; }
        .dm-name { font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; gap: 4px; }
        .dm-last { display: block; max-width: 100%; font-size: 13.5px; color: var(--ch-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
        .dm-badge { background: var(--ch-danger); color: #fff; font-size: 12px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; font-variant-numeric: tabular-nums; }
        .dm-time { font-size: 12px; color: var(--ch-muted); font-variant-numeric: tabular-nums; }
        .dm-swipe { position: relative; overflow: hidden; border-top: 1px solid var(--ch-line); touch-action: pan-y; margin: 0 -8px; border-radius: var(--ch-r-sm); }
        .dm-swipe:first-of-type, h2 + div > .dm-swipe:first-child { border-top: 0; }
        .dm-swipe .dm-row { border-top: 0; margin: 0; background: var(--ch-surface); position: relative; z-index: 1; transition: transform .22s cubic-bezier(.2,.9,.3,1), background-color var(--ch-dur-1) ease; will-change: transform; }
        .dm-swipe .dm-row:hover { background: color-mix(in srgb, var(--ch-surface-2) 60%, var(--ch-surface)); }
        .dm-swipe.dragging .dm-row { transition: none; }
        .dm-acts { position: absolute; top: 0; right: 0; bottom: 0; width: 216px; display: flex; }
        .dm-acts button { flex: 1; border: 0; font: 600 13px/1.2 var(--ch-font-ui); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
        .dm-acts .a-pin { background: #d97706; } .dm-acts .a-mute { background: #6b7280; } .dm-acts .a-read { background: #2563eb; }
        .dm-more { border: 0; background: transparent; cursor: pointer; margin-left: 2px; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; color: var(--ch-muted); flex-shrink: 0; }
        .dm-more:hover { background: var(--ch-surface-3); color: var(--ch-text); }
        .dm-more:focus-visible { outline: none; box-shadow: var(--ch-focus); }
        .dm-pin, .dm-mutedi { display: inline-flex; color: var(--ch-faint); }
        @media (prefers-reduced-motion: reduce) { .dm-swipe .dm-row { transition: none; } }
        .dm-empty { color: var(--ch-muted); font-size: 14px; padding: 8px 4px; }
    </style>
</head>
<body>
<div id="app-root">
    <div class="ch-glow" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="ch-header">
        <div class="ch-header__bar">
            <a class="ch-iconbtn" href="/" aria-label="Back to home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></a>
            <span class="ch-header__small" aria-hidden="true">Messages</span>
        </div>
        <h1 class="ch-header__title">Messages</h1>
        <p class="ch-header__sub">Your family chats and one-to-one conversations.</p>
    </header>
    <main class="wrap" id="main">
        <section class="card" aria-labelledby="h-talk">
            <h2 id="h-talk">Your conversations</h2>
            <div id="talked"><p class="dm-empty">Loading&hellip;</p></div>
        </section>
        <section class="card" aria-labelledby="h-new">
            <h2 id="h-new">Start a conversation</h2>
            <div id="others"></div>
        </section>
    </main>
</div>
<script src="/haptics.js"></script>
<script src="/robot.js"></script>
<script src="/settings/settings.js"></script>
<script src="/messages/messages.js"></script>
</body>
</html>
