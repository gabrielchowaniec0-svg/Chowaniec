<!-- Checkers banner for /games/ (a red piece double-jumps and gets crowned). Scoped CSS: every class starts with bn-checkers. -->
<style>
.bn-checkers { display: block; width: 100%; height: 100%; }
.bn-checkers .fbk, .bn-checkers [class^="bn-checkers-"] { transform-box: fill-box; transform-origin: center; }
.bn-checkers-tw { animation: bnCkTw var(--d, 2.4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes bnCkTw { 0%, 100% { transform: scale(.3) rotate(0); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.bn-checkers-bob { animation: bnCkBob 1.8s ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
@keyframes bnCkBob { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
.bn-checkers-hop { animation: bnCkHop 5.6s linear infinite; }
@keyframes bnCkHop {
  0%, 16% { transform: translate(0, 0) scale(1); animation-timing-function: ease-in; }
  23% { transform: translate(30px, -52px) scale(1.18); animation-timing-function: ease-out; }
  30%, 42% { transform: translate(60px, -60px) scale(1); animation-timing-function: ease-in; }
  49% { transform: translate(90px, -112px) scale(1.18); animation-timing-function: ease-out; }
  56%, 86% { transform: translate(120px, -120px) scale(1); opacity: 1; }
  92% { transform: translate(120px, -120px) scale(.6); opacity: 0; }
  96% { transform: translate(0, 0) scale(.6); opacity: 0; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}
.bn-checkers-crown { opacity: 0; animation: bnCkCrown 5.6s linear infinite; }
@keyframes bnCkCrown { 0%, 58% { transform: translateY(-26px); opacity: 0; } 61% { opacity: 1; animation-timing-function: cubic-bezier(.3,1.6,.5,1); } 67%, 86% { transform: translateY(0); opacity: 1; } 92%, 100% { transform: translateY(0); opacity: 0; } }
.bn-checkers-shine { opacity: 0; animation: bnCkShine 5.6s ease-out infinite; }
@keyframes bnCkShine { 0%, 64% { opacity: 0; transform: scale(.4); } 70% { opacity: 1; transform: scale(1.1); } 80% { opacity: 0; transform: scale(1.3); } 100% { opacity: 0; } }
.bn-checkers-cap1 { animation: bnCkCap1 5.6s linear infinite; }
.bn-checkers-cap2 { animation: bnCkCap2 5.6s linear infinite; }
@keyframes bnCkCap1 { 0%, 26% { transform: scale(1); opacity: 1; } 31% { transform: scale(1.4); opacity: 0; } 94% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bnCkCap2 { 0%, 52% { transform: scale(1); opacity: 1; } 57% { transform: scale(1.4); opacity: 0; } 94% { transform: scale(.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.bn-checkers-pop1, .bn-checkers-pop2 { opacity: 0; }
.bn-checkers-pop1 { animation: bnCkPop1 5.6s ease-out infinite; }
.bn-checkers-pop2 { animation: bnCkPop2 5.6s ease-out infinite; }
@keyframes bnCkPop1 { 0%, 26% { opacity: 0; transform: scale(.3); } 30% { opacity: 1; transform: scale(1); } 38%, 100% { opacity: 0; transform: scale(1.4); } }
@keyframes bnCkPop2 { 0%, 52% { opacity: 0; transform: scale(.3); } 56% { opacity: 1; transform: scale(1); } 64%, 100% { opacity: 0; transform: scale(1.4); } }
.bn-checkers-land1 { animation: bnCkLand1 5.6s linear infinite; }
.bn-checkers-land2 { animation: bnCkLand2 5.6s linear infinite; }
@keyframes bnCkLand1 { 0%, 29% { opacity: 0; } 31%, 42% { opacity: .45; } 48%, 100% { opacity: 0; } }
@keyframes bnCkLand2 { 0%, 55% { opacity: 0; } 57%, 86% { opacity: .5; } 92%, 100% { opacity: 0; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bn-checkers { filter: saturate(.94) brightness(.9); } }
:root[data-theme="dark"] .bn-checkers { filter: saturate(.94) brightness(.9); }
@media (prefers-reduced-motion: reduce) { .bn-checkers * { animation: none !important; } }
</style>
