<!-- Doodle Guess banner for /games/index.html: a pencil doodles a cat on an easel while guess bubbles pop up
     ("dog?", "fox?", then "CAT!"). Flat illustrated style matching the other scenes (320×200, slice-fitted).
     Paste the <style> once and the <svg> inside the card's .art (it uses class="scene", so the page's
     ".art.run" rule starts and pauses it like the other banners). Everything is scoped to .bn-doodle. -->
<style>
.bn-doodle{display:block;width:100%;height:100%}
.bn-doodle text{font-family:Outfit,system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:800}
.bn-doodle .bd-ln{fill:none;stroke:#27172b;stroke-linecap:round;stroke-linejoin:round}
.bn-doodle .bd-a{stroke-dasharray:268;stroke-dashoffset:268;animation:bdOutline 7s linear infinite}
.bn-doodle .bd-b{stroke-dasharray:12;stroke-dashoffset:12;animation:bdEyes 7s linear infinite}
.bn-doodle .bd-c{stroke-dasharray:30;stroke-dashoffset:30;animation:bdMouth 7s linear infinite}
.bn-doodle .bd-d{stroke-dasharray:24;stroke-dashoffset:24;animation:bdWhisk 7s linear infinite}
.bn-doodle .bd-fill{opacity:0;animation:bdFill 7s ease-out infinite}
.bn-doodle .bd-pen{animation:bdPen 7s linear infinite}
.bn-doodle .bd-bub{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
.bn-doodle .bd-b1{animation:bdB1 7s ease-out infinite}
.bn-doodle .bd-b2{animation:bdB2 7s ease-out infinite}
.bn-doodle .bd-b3{animation:bdB3 7s ease-out infinite}
.bn-doodle .bd-burst{opacity:0;transform-box:fill-box;transform-origin:center;animation:bdBurst 7s ease-out infinite}
.bn-doodle .bd-tw{transform-box:fill-box;transform-origin:center;animation:bdTw 2.4s ease-in-out infinite}
.bn-doodle .bd-tw.t2{animation-delay:-.8s}.bn-doodle .bd-tw.t3{animation-delay:-1.6s}
.bn-doodle .bd-bob{animation:bdBob 2.6s ease-in-out infinite alternate}

@keyframes bdEyes{0%,42%{stroke-dashoffset:12}47%,90%{stroke-dashoffset:0;opacity:1}96%,100%{stroke-dashoffset:0;opacity:0}}
