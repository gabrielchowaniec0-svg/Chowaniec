<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#000000"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><script src="/pwa.js" defer></script>
    <title>Games · Chowaniec</title>
    <link rel="stylesheet" href="/theme.css">
    <script src="/theme.js"></script>
    <!-- Tailwind is only used by the shared passcode box -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/passwords.js"></script>
    <script src="/auth-gate.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap">
    <link rel="stylesheet" href="/games/games.css">
    <!-- Only for ChowGames.icon / badge / meta: core.js does nothing else until a game calls mount(). -->
    <script src="/games/core.js"></script>
    <style>
        body { background: var(--cg-bg); }
        .hub { max-width: 1120px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 44px); box-sizing: border-box; }
        .hub-top { display: flex; align-items: center; gap: 10px; }
        .round-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--cg-ink); background: var(--cg-surface); border: 1px solid var(--cg-line); box-sizing: border-box; transition: background .15s, transform .15s; }
        .round-btn:hover { background: var(--cg-soft); }
        .round-btn:active { transform: scale(.94); }
        .hub h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: clamp(32px, 6vw, 44px); margin: 18px 0 6px; letter-spacing: -.01em; }
        .hub h1 em { color: var(--cg-muted); }
        .hub .lead { color: var(--cg-muted); margin: 0 0 22px; font-size: 15px; line-height: 1.5; max-width: 560px; }
        .chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px 1px 7px; border-radius: 999px; background: var(--cg-soft); color: var(--cg-ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; vertical-align: 1px; }
        .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 2px 12px; }
        .sec h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cg-muted); }
        .sec span { font-size: 13px; color: var(--cg-muted); }

        /* Featured */
        .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); border-radius: 26px; overflow: hidden; text-decoration: none; color: var(--cg-ink); background: var(--cg-surface); border: 1px solid var(--cg-line); box-shadow: 0 2px 12px rgba(0,0,0,.05); transition: transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s; }
        .hero:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -12px color-mix(in srgb, var(--to) 45%, transparent); }
        .hero .art { aspect-ratio: 16 / 10; }
        .hero-body { padding: 26px 28px; display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative; }
        .hero-body::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, color-mix(in srgb, var(--from) 14%, transparent), transparent 60%); pointer-events: none; }
        .hero-pills { display: flex; gap: 6px; flex-wrap: wrap; }
        .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
        .pill.new { background: var(--cg-ink); color: var(--cg-bg); }
        .pill.soft { background: color-mix(in srgb, var(--to) 14%, var(--cg-surface)); color: color-mix(in srgb, var(--to) 75%, var(--cg-ink)); }
        .hero h3 { display: flex; align-items: center; gap: 12px; margin: 4px 0 0; font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; letter-spacing: -.02em; }
        .hero p { margin: 0; color: var(--cg-muted); font-size: 15.5px; line-height: 1.5; }
        .play-btn { align-self: flex-start; margin-top: 8px; display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 22px 0 18px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 15px; background: linear-gradient(135deg, var(--from), var(--to)); box-shadow: 0 8px 20px -8px var(--to), inset 0 -2px 0 rgba(0,0,0,.12); transition: transform .15s; }
        .hero:hover .play-btn { transform: translateX(3px); }
        .play-btn .cg-ic { fill: currentColor; }

        /* Game cards */
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; --left: 1; }
        @media (min-width: 860px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); --left: 2; } }
        @media (min-width: 1000px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); --left: 3; } }
        @media (max-width: 560px) { .grid { gap: 10px; } }
        .game { position: relative; display: flex; flex-direction: column; border-radius: 22px; overflow: hidden; text-decoration: none; color: var(--cg-ink); background: var(--cg-surface); border: 1px solid var(--cg-line); box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04); transition: transform .2s cubic-bezier(.2,.8,.3,1), box-shadow .2s; -webkit-tap-highlight-color: transparent; }
        .game:hover { transform: translateY(-5px); box-shadow: 0 18px 34px -12px color-mix(in srgb, var(--to) 55%, transparent), 0 2px 6px rgba(0,0,0,.05); }
        .game:active, .hero:active { transform: scale(.98); }
        .game:focus-visible, .hero:focus-visible { outline: 3px solid var(--to); outline-offset: 3px; }
        .art { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: linear-gradient(135deg, var(--from), var(--to)); isolation: isolate; }
        .ext-banner { position: absolute; inset: 0; }
        .ext-banner > div { position: absolute; inset: 0; }
        .art .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: transform .45s cubic-bezier(.2,.8,.3,1); }
        .game:hover .scene, .hero:hover .scene { transform: scale(1.045); }
        .art::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 -1px 0 rgba(0,0,0,.06); pointer-events: none; }
        .tag { position: absolute; z-index: 2; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 9px 0 7px; border-radius: 999px; background: rgba(255,255,255,.9); color: #18181b; font-size: 11px; font-weight: 700; letter-spacing: .01em; box-shadow: 0 2px 8px rgba(0,0,0,.12); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
        .tag .cg-ic { color: var(--to); }
        .tag .live { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; margin: 0 1px 0 2px; box-shadow: 0 0 0 0 rgba(239,68,68,.6); animation: livePulse 1.6s ease-out infinite; }
        @keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.55); } 80%, 100% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } }
        .newflag { position: absolute; z-index: 2; top: 10px; right: 10px; height: 22px; padding: 0 8px; display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; background: #18181b; color: #fff; font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
        .newflag .cg-ic { color: #fde047; }
        .go { position: absolute; z-index: 2; right: 10px; bottom: 10px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fff; color: var(--to); box-shadow: 0 6px 16px rgba(0,0,0,.2); opacity: 0; transform: scale(.6) translateY(6px); transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.3); }
        .go .cg-ic { fill: currentColor; margin-left: 2px; }
        .game:hover .go { opacity: 1; transform: none; }
        .info { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
        .title { display: flex; align-items: center; gap: 9px; }
        .title b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
        .info .desc { font-size: 13px; color: var(--cg-muted); line-height: 1.4; }
        .scores { margin-top: auto; padding-top: 10px; display: flex; flex-direction: column; gap: 5px; min-height: 42px; justify-content: flex-end; }
        .sc { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--cg-muted); min-width: 0; }
        .sc .ico { flex: none; width: 20px; height: 20px; border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; background: var(--cg-soft); color: var(--cg-muted); }
        .sc.top .ico { background: linear-gradient(135deg, #fde68a, #f59e0b); color: #fff; box-shadow: inset 0 -1px 0 rgba(0,0,0,.12); }
        .sc .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sc.top .nm { color: var(--cg-ink); font-weight: 600; }
        .sc .pts { margin-left: auto; flex: none; font-weight: 700; color: var(--cg-ink); font-variant-numeric: tabular-nums; }
        .sc.me .pts { font-weight: 600; color: var(--cg-muted); }
        .sc.first { color: var(--cg-muted); align-items: flex-start; }
        .sc.first .nm { white-space: normal; line-height: 1.35; padding-top: 1px; }
        .sk { height: 12px; border-radius: 6px; background: var(--cg-soft); animation: skPulse 1.4s ease-in-out infinite alternate; }
        .sk + .sk { width: 60%; }
        @keyframes skPulse { from { opacity: 1; } to { opacity: .45; } }
        @media (max-width: 560px) {
            .info { padding: 10px 11px 12px; gap: 4px; }
            .title { gap: 7px; } .title b { font-size: 15px; } .title .cg-badge { width: 24px !important; height: 24px !important; } .title .cg-badge svg { width: 14px; height: 14px; }
            .info .desc { font-size: 12px; }
            .sc { font-size: 12px; gap: 6px; } .sc .ico { width: 18px; height: 18px; border-radius: 6px; }
            .tag { top: 7px; left: 7px; height: 20px; font-size: 10px; padding: 0 7px 0 6px; }
            .newflag { top: 7px; right: 7px; height: 20px; font-size: 9.5px; padding: 0 6px; }
            .go { display: none; }
        }
        @media (max-width: 720px) {
            .hero { grid-template-columns: 1fr; }
            .hero-body { padding: 16px 18px 20px; gap: 8px; }
            .hero p { font-size: 14px; }
        }

        /* Play together: fills the space after the last card */
        .together { grid-column: span var(--left); display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: 22px; border: 1px dashed color-mix(in srgb, var(--cg-ink) 18%, transparent); background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, #f472b6 10%, transparent), transparent 60%), radial-gradient(120% 90% at 100% 100%, color-mix(in srgb, #38bdf8 10%, transparent), transparent 60%), var(--cg-surface); }
        .together h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
        .together h2 .cg-ic { color: #ec4899; }
        .together .tsub { margin: 4px 0 0; font-size: 13.5px; color: var(--cg-muted); }
        .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 18px; flex: 1; align-content: space-evenly; }
        .step { display: flex; gap: 11px; align-items: flex-start; }
        .step .si { flex: none; width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), 0 4px 10px -4px rgba(0,0,0,.3); }
        .step div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
        .step b { font-size: 14.5px; }
        .step span { font-size: 13px; color: var(--cg-muted); line-height: 1.4; }
        @media (max-width: 859px) { .together { padding: 14px 12px; gap: 12px; } .together .steps { grid-template-columns: 1fr; gap: 10px; } .together h2 { font-size: 15px; } .together .tsub { font-size: 12px; } .step .si { width: 30px; height: 30px; border-radius: 10px; } .step .si svg { width: 16px; height: 16px; } .step b { font-size: 13px; } .step span { display: none; } .step { align-items: center; gap: 9px; } }
        .note { margin-top: 26px; font-size: 13px; color: var(--cg-muted); text-align: center; display: flex; align-items: center; justify-content: center; gap: 6px; }

        /* Dark: keep the scenes bright but not glaring */
        @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .art .scene { filter: saturate(.94) brightness(.9); } }
        :root[data-theme="dark"] .art .scene { filter: saturate(.94) brightness(.9); }

        /* ---- Scene animation kit (transform/opacity only) ---- */
        .scene text { font-family: Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 800; }
        .scene * { animation-play-state: paused !important; }
        .art.run .scene * { animation-play-state: running !important; }
        .fb { transform-box: fill-box; transform-origin: center; }
        .a-scroll { animation: scrollX var(--d, 4s) linear infinite; }
        .a-scroll64 { animation: scroll64 var(--d, .4s) linear infinite; }
        .a-scroll160 { animation: scroll160 var(--d, 3s) linear infinite; }
        @keyframes scrollX { from { transform: translateX(0); } to { transform: translateX(-320px); } }
        @keyframes scroll64 { from { transform: translateX(0); } to { transform: translateX(-64px); } }
        @keyframes scroll160 { from { transform: translateX(0); } to { transform: translateX(-160px); } }
        .a-spin { animation: spin var(--d, 1s) linear infinite; transform-box: fill-box; transform-origin: center; }
        .a-orbit { animation: spin var(--d, 6s) linear infinite; transform-box: view-box; transform-origin: var(--ox) var(--oy); }
        @keyframes spin { to { transform: rotate(360deg); } }
        .a-bob { animation: bob var(--d, 2s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
        @keyframes bob { from { transform: translateY(calc(var(--a, 4px) * -1)); } to { transform: translateY(var(--a, 4px)); } }
        .a-drift { animation: drift var(--d, 6s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
        @keyframes drift { from { transform: translateX(calc(var(--a, 8px) * -1)); } to { transform: translateX(var(--a, 8px)); } }
        .a-sway { animation: sway var(--d, 2s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: var(--o, 50% 100%); }
        @keyframes sway { from { transform: rotate(calc(var(--r, 3deg) * -1)); } to { transform: rotate(var(--r, 3deg)); } }
        .a-twinkle { animation: twinkle var(--d, 2s) ease-in-out infinite; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: center; }
        @keyframes twinkle { 0%, 100% { transform: scale(.25) rotate(0deg); opacity: .15; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
        .a-blink { animation: blink var(--d, 1s) steps(1, end) infinite; animation-delay: var(--dl, 0s); }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: .25; } }
        .a-glow { animation: glow var(--d, 3s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
        @keyframes glow { from { opacity: var(--lo, .35); } to { opacity: 1; } }
        .a-pulse { animation: pulse var(--d, 3s) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
        @keyframes pulse { from { transform: scale(.92); opacity: .5; } to { transform: scale(1.08); opacity: .9; } }
        .a-zoom { animation: zoom var(--d, .6s) linear infinite; animation-delay: var(--dl, 0s); }
        @keyframes zoom { 0% { transform: translateX(24px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateX(-36px); opacity: 0; } }
        .a-puff { animation: puff var(--d, .7s) ease-out infinite; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: center; }
        @keyframes puff { 0% { transform: translateX(0) scale(.35); opacity: .8; } 100% { transform: translateX(var(--px, -16px)) scale(1.5); opacity: 0; } }
        .a-fall { animation: fall var(--d, 4s) linear infinite; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: center; }
        @keyframes fall { from { transform: translateY(-30px) rotate(0deg); } to { transform: translateY(230px) rotate(540deg); } }
        .a-flap { animation: flap var(--d, .16s) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 85% 40%; }
        @keyframes flap { from { transform: rotate(-38deg); } to { transform: rotate(22deg); } }
        .a-leg { animation: leg var(--d, .3s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: 50% 10%; }
        @keyframes leg { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
        .a-flick { animation: flick var(--d, .8s) ease-in-out infinite; transform-box: fill-box; transform-origin: 0 50%; }
        @keyframes flick { 0%, 40%, 100% { transform: scaleX(0); } 55%, 75% { transform: scaleX(1); } }
        .a-flutter { animation: flutter var(--d, .5s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); transform-box: fill-box; transform-origin: 50% 0; }
        @keyframes flutter { from { transform: skewX(-8deg) scaleY(.92); } to { transform: skewX(8deg) scaleY(1.04); } }
        .a-wave { animation: wave var(--d, .7s) ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0 50%; }
        @keyframes wave { from { transform: scaleX(1) skewY(-6deg); } to { transform: scaleX(.86) skewY(7deg); } }

        @media (prefers-reduced-motion: reduce) {
            .scene, .scene * { animation: none !important; }
            .game, .hero, .scene, .go, .play-btn { transition: none !important; }
            .game:hover .scene, .hero:hover .scene { transform: none; }
            .tag .live, .sk { animation: none !important; }
        }
    </style>
</head>
<body>
    <div id="app-root">
        <div class="hub">
            <div class="hub-top"><a class="round-btn" href="/" aria-label="Back to the hub" id="back"></a></div>
            <h1>Chowaniec <em>Games</em></h1>
            <p class="lead" id="lead">Beat the family high scores, or tap <span class="chip" id="lead-chip">Play together</span> in any game and send the invite to a chat.</p>
            <a class="hero" id="hero"></a>
            <div class="sec"><h2>All games</h2><span id="count"></span></div>
            <div class="grid" id="grid"></div>
            <p class="note" id="note">High scores are shared with the whole family.</p>
        </div>
    </div>
    <script>
    (function () {
        'use strict';
        const CG = window.ChowGames;
        const icon = (n, s) => (CG ? CG.icon(n, s) : '');
        const badge = (id, s) => (CG ? CG.badge(id, s) : '');
        const META = Object.assign({
            dino: { from: '#fbbf24', to: '#f97316' }, road: { from: '#38bdf8', to: '#6366f1' }, hop: { from: '#7dd3fc', to: '#facc15' },
            snake: { from: '#a3e635', to: '#16a34a' }, 2048: { from: '#fdba74', to: '#ea580c' }, four: { from: '#60a5fa', to: '#1d4ed8' },
            memory: { from: '#c4b5fd', to: '#d946ef' }, word: { from: '#86efac', to: '#059669' }, kart: { from: '#f87171', to: '#be123c' },
            style: { from: '#f9a8d4', to: '#a855f7' }, police: { from: '#93c5fd', to: '#1e3a8a' }, puzzle: { from: '#5eead4', to: '#0e7490' },
            trivia: { from: '#fde047', to: '#f472b6' }
        }, CG ? CG.meta : {});

        const GAMES = [
            { id: 'doodle', name: 'Doodle Guess', desc: 'One draws, everyone guesses. Giggles guaranteed.', tag: 'Party', tagIcon: 'palette', isNew: true, pitch: 'One person draws a secret word, everyone else races to guess it on their own phone. Draw, guess, giggle, swap.' },
            { id: 'golf', name: 'Mini Golf', desc: '18 holes of windmills, loops and pirate coves.', tag: 'Live race', tagIcon: 'live', isNew: true },
            { id: 'clash', name: 'Color Clash', desc: 'Match colours and numbers, then shout Clash!', tag: '2–6 players', tagIcon: 'users', isNew: true },
            { id: 'dice', name: 'Dice Party', desc: 'Roll, hold and score the perfect dice combos.', tag: '1–6 players', tagIcon: 'users', isNew: true },
            { id: 'blocks', name: 'Block Drop', desc: 'Clear lines to send blocks to the family.', tag: 'Versus', tagIcon: 'zap', isNew: true },
            { id: 'typing', name: 'Type Racer', desc: 'Type fast and race your car to the flag.', tag: 'Race', tagIcon: 'flag', isNew: true },
            { id: 'chef', name: 'Kitchen Rush', desc: 'Cook, plate and serve orders as a team.', tag: 'Co-op race', tagIcon: 'users', isNew: true },
            { id: 'checkers', name: 'Checkers', desc: 'Jump, capture and crown your kings.', tag: '2 players', tagIcon: 'users', isNew: true },
            { id: 'ludo', name: 'Race Home', desc: 'Roll the die and bring all four home first.', tag: '2–4 players', tagIcon: 'users', isNew: true },
            { id: 'kart', name: 'Kart Party', desc: 'Drift round the track and race the family live.', tag: 'Live race', tagIcon: 'live' },
            { id: 'style', name: 'Style Star', desc: 'Dress up for the theme, then win the runway vote.', tag: 'Party', tagIcon: 'sparkles' },
            { id: 'police', name: 'Police Patrol', desc: 'Patrol the town, help neighbours, catch cheeky robbers.', tag: 'Adventure', tagIcon: 'mapPin' },
            { id: 'puzzle', name: 'Picture Puzzle', desc: 'Jigsaw or slide puzzle, made from your own photo.', tag: 'Your photo', tagIcon: 'camera' },
            { id: 'trivia', name: 'Trivia Party', desc: 'A family quiz show. Buzz in fast, answer right.', tag: 'Party', tagIcon: 'party' },
            { id: 'dino', name: 'Dino Dash', desc: 'Jump the cacti, duck the birds, run forever.', tag: 'Race', tagIcon: 'flag' },
            { id: 'road', name: 'Road Rush', desc: 'Weave through traffic and beat the clock.', tag: 'Race', tagIcon: 'flag' },
            { id: 'hop', name: 'Sky Hop', desc: 'Flap a little chick through the clouds.', tag: 'Race', tagIcon: 'flag' },
            { id: 'snake', name: 'Snake', desc: 'Eat apples, grow longer, don’t bump yourself.', tag: 'Race', tagIcon: 'flag' },
            { id: '2048', name: '2048', desc: 'Slide and merge tiles to reach 2048.', tag: 'Race', tagIcon: 'flag' },
            { id: 'four', name: 'Four in a Row', desc: 'Line up four before your opponent does.', tag: '2 players', tagIcon: 'users' },
            { id: 'memory', name: 'Memory Match', desc: 'Flip the cards and find all the pairs.', tag: '1–4 players', tagIcon: 'users' },
            { id: 'word', name: 'Daily Word', desc: 'Guess the family’s word of the day in six tries.', tag: 'Daily', tagIcon: 'calendar' }

            },
            police(u) {
                const bld = [[0, 92, 34], [38, 70, 28], [70, 104, 40], [114, 80, 26], [144, 60, 34], [182, 96, 30], [216, 76, 38], [258, 100, 26], [288, 84, 32]];
                let city = '';

                    city += `<rect x="${x}" y="${top}" width="${w}" height="${150 - top}" fill="#1e3a8a" opacity=".85"/>`;
                    for (let y = top + 8; y < 140; y += 13) for (let wx = x + 6; wx < x + w - 6; wx += 10) {
                        const k = (bi * 7 + y + wx) % 5;
                        if (k < 2) city += `<rect ${k === 0 ? `class="a-blink" style="--d:${n1(2 + (wx % 3))}s;--dl:-${n1((y % 7) * .3)}s"` : ''} x="${wx}" y="${y}" width="5" height="6" rx="1" fill="#fde68a" opacity=".9"/>`;
                    }
                });
                let dashes = ''; for (let x = 0; x < 400; x += 64) dashes += `<rect x="${x}" y="178" width="30" height="4" rx="2" fill="#e2e8f0" opacity=".85"/>`;
                const flash = (name, on) => kf(name, on ? [[0, 'opacity:1'], [42, 'opacity:1'], [50, 'opacity:.12'], [92, 'opacity:.12'], [100, 'opacity:1']] : [[0, 'opacity:.12'], [42, 'opacity:.12'], [50, 'opacity:1'], [92, 'opacity:1'], [100, 'opacity:.12']]);
                const R = flash('plR', true), B = flash('plB', false);
                return frame(u, '#1e3a8a', '#93c5fd',
                    [[30, 20], [90, 36], [140, 14], [210, 30], [250, 12], [300, 46], [60, 56], [180, 50]].map(([x, y], i) => `<circle class="a-twinkle" style="--d:${n1(1.6 + (i % 3) * .5)}s;--dl:-${n1(i * .4)}s" cx="${x}" cy="${y}" r="1.6" fill="#fff"/>`).join('') +
                    `<circle cx="226" cy="40" r="20" fill="#fef9c3" opacity=".2"/><circle cx="226" cy="40" r="12" fill="#fef9c3"/><circle cx="222" cy="37" r="2.5" fill="#fde68a"/><circle cx="230" cy="44" r="1.8" fill="#fde68a"/>` +
                    `<g class="a-scroll" style="--d:16s">${twice(city)}</g>` +
                    `<rect y="146" width="320" height="10" fill="#94a3b8"/><rect y="154" width="320" height="46" fill="#334155"/><g class="a-scroll64" style="--d:.42s">${dashes}</g>` +
                    `<ellipse cx="128" cy="190" rx="40" ry="6" fill="#ef4444" opacity=".3" style="animation:${R} .8s linear infinite"/><ellipse cx="180" cy="190" rx="40" ry="6" fill="#3b82f6" opacity=".35" style="animation:${B} .8s linear infinite"/>` +
                    `<g transform="translate(150 178)">${shadow(2, 11, 66, 4.5, .3)}` +
                    `<path d="M68 -12L150 -36V18Z" fill="url(#hl-${u})"/>` +
                    `<g class="a-bob" style="--d:.22s;--a:.7px">` +
                    `<circle cx="-7" cy="-53" r="30" fill="url(#rg-${u})" style="animation:${R} .8s linear infinite"/><circle cx="9" cy="-53" r="30" fill="url(#bg2-${u})" style="animation:${B} .8s linear infinite"/>` +
                    `<path d="M-64 -4C-64 -14 -60 -20 -48 -21L-30 -22L-19 -40C-17 -43 -14 -44 -11 -44L22 -44C26 -44 29 -42 31 -39L42 -22L56 -20C64 -19 68 -14 68 -6V0C68 3 66 5 63 5H-60C-63 5 -64 3 -64 0Z" fill="#f8fafc"/>` +
                    `<path d="M-64 -10H68V0C68 3 66 5 63 5H-60C-63 5 -64 3 -64 0Z" fill="#1d4ed8"/><text x="2" y="1.5" text-anchor="middle" font-size="8.5" fill="#fff" letter-spacing="1.2">POLICE</text>` +
                    `<path d="M-26 -23L-16 -39H5V-23Z" fill="#bae6fd"/><path d="M9 -23V-39H20L30 -23Z" fill="#bae6fd"/><path d="M-20 -26L-12 -37" stroke="#fff" stroke-width="2" opacity=".7" stroke-linecap="round"/>` +
                    `<circle cx="17" cy="-29" r="5.5" fill="#fcd9b6"/><path d="M11 -33Q17 -40 23 -33Z" fill="#1e3a8a"/><rect x="10.5" y="-34" width="13" height="2.4" rx="1.2" fill="#1e3a8a"/><circle cx="17" cy="-36" r="1.2" fill="#fde047"/><circle cx="19" cy="-29" r="1" fill="#1f2937"/>` +
                    `<path d="${star5(-14, -14, 4.5, 2)}" fill="#facc15"/><path d="M7 -22V-10" stroke="#cbd5e1" stroke-width="1.5"/><ellipse cx="65" cy="-14" rx="3" ry="3.5" fill="#fef9c3"/><rect x="-65" y="-18" width="4" height="6" rx="2" fill="#ef4444"/>` +
                    `<rect x="-14" y="-48" width="30" height="4.5" rx="2" fill="#334155"/><rect x="-14" y="-54" width="14" height="7" rx="3" fill="#ef4444"/><rect x="2" y="-54" width="14" height="7" rx="3" fill="#3b82f6"/>` +
                    `<rect x="-14" y="-54" width="14" height="7" rx="3" fill="#fecaca" style="animation:${R} .8s linear infinite"/><rect x="2" y="-54" width="14" height="7" rx="3" fill="#bfdbfe" style="animation:${B} .8s linear infinite"/>` +
                    `</g>${wheel(-38, 2, 12, '.4s')}${wheel(44, 2, 12, '.4s')}</g>`,
                    `<radialGradient id="rg-${u}"><stop offset="0" stop-color="#f87171" stop-opacity=".9"/><stop offset="1" stop-color="#f87171" stop-opacity="0"/></radialGradient>` +
                    `<radialGradient id="bg2-${u}"><stop offset="0" stop-color="#60a5fa" stop-opacity=".9"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>` +
                    `<linearGradient id="hl-${u}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fef9c3" stop-opacity=".55"/><stop offset="1" stop-color="#fef9c3" stop-opacity="0"/></linearGradient>`);
            },
            puzzle(u) {
                const X0 = 118, Y0 = 46, S = 50, H = [[1, -1, 1]], V = [[-1, 1], [1, -1]];
                const edge = (ax, ay, bx, by, nx, ny, k) => {
                    if (!k) return `L${bx} ${by}`;
                    const P = (a, v) => `${n1(ax + (bx - ax) * a + nx * v * S * k)} ${n1(ay + (by - ay) * a + ny * v * S * k)}`;
                    return `L${P(.38, 0)}C${P(.42, .08)} ${P(.27, .24)} ${P(.5, .24)}C${P(.73, .24)} ${P(.58, .08)} ${P(.62, 0)}L${bx} ${by}`;
                };
                const piece = (c, r) => {
                    const x = X0 + c * S, y = Y0 + r * S;
                    const kt = r === 0 ? 0 : -H[r - 1][c], kr = c === 2 ? 0 : V[r][c], kb = r === 1 ? 0 : H[r][c], kl = c === 0 ? 0 : -V[r][c - 1];
                    return `M${x} ${y}` + edge(x, y, x + S, y, 0, -1, kt) + edge(x + S, y, x + S, y + S, 1, 0, kr) + edge(x + S, y + S, x, y + S, 0, 1, kb) + edge(x, y + S, x, y, -1, 0, kl) + 'Z';
                };
                const miss = piece(0, 1);
                const pic = `<rect x="${X0}" y="${Y0}" width="150" height="100" fill="url(#ps-${u})"/><circle cx="238" cy="70" r="20" fill="#fef9c3" opacity=".7"/><circle cx="238" cy="70" r="13" fill="#fde047"/>${cloud(170, 66, .55, '#fff', .95)}` +
                    `<path d="M${X0} 112Q160 84 200 104T268 96V146H${X0}Z" fill="#4ade80"/><path d="M${X0} 128Q170 110 220 124T268 120V146H${X0}Z" fill="#22c55e"/>` +
                    `<rect x="210" y="98" width="4" height="14" fill="#92400e"/><circle cx="212" cy="94" r="10" fill="#16a34a"/>` +
                    `<rect x="148" y="104" width="4" height="9" fill="#b91c1c"/><rect x="130" y="114" width="26" height="22" fill="#fef3c7"/><path d="M126 116L143 100L160 116Z" fill="#ef4444"/><rect x="139" y="124" width="8" height="12" rx="1" fill="#b45309"/><rect x="149" y="119" width="5" height="5" fill="#7dd3fc"/>` +
                    `<circle cx="180" cy="138" r="2.4" fill="#fde047"/><circle cx="190" cy="134" r="2.4" fill="#f9a8d4"/><circle cx="240" cy="136" r="2.4" fill="#fde047"/>`;
                let seams = ''; for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++) if (!(c === 0 && r === 1)) seams += `<path d="${piece(c, r)}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.3"/>`;
                const D = '5s';
                const fly = kf('pzFly', [[0, 'transform:translate(-80px,10px) rotate(-14deg);opacity:1'], [20, 'transform:translate(-80px,2px) rotate(-10deg);opacity:1'], [34, 'transform:translate(-80px,10px) rotate(-14deg);opacity:1;animation-timing-function:cubic-bezier(.4,0,.2,1)'], [54, 'transform:translate(0,0) rotate(0deg) scale(1.06);opacity:1'], [58, 'transform:translate(0,0) rotate(0deg) scale(1);opacity:1'], [86, 'transform:translate(0,0) rotate(0deg) scale(1);opacity:1'], [90, 'transform:translate(0,0) rotate(0deg) scale(1);opacity:0'], [91, 'transform:translate(-80px,16px) rotate(-14deg);opacity:0'], [98, 'transform:translate(-80px,10px) rotate(-14deg);opacity:1'], [100, 'transform:translate(-80px,10px) rotate(-14deg);opacity:1']]);
                const ring = kf('pzRing', [[0, 'transform:scale(.7);opacity:0'], [54, 'transform:scale(.7);opacity:0'], [57, 'transform:scale(.9);opacity:1'], [70, 'transform:scale(1.5);opacity:0'], [100, 'transform:scale(1.5);opacity:0']]);
                const sp = kf('pzSpark', [[0, 'transform:scale(0);opacity:0'], [56, 'transform:scale(0);opacity:0'], [60, 'transform:scale(1.1);opacity:1'], [72, 'transform:scale(.6);opacity:0'], [100, 'transform:scale(0);opacity:0']]);
                return frame(u, '#a5f3fc', '#2dd4bf',
                    spark(282, 30, 6, '#fff', 'a-twinkle', '--d:2.4s') + spark(30, 34, 7, '#fff', 'a-twinkle', '--d:2.8s;--dl:-1s') + spark(300, 176, 5, '#fff', 'a-twinkle', '--d:2s;--dl:-.6s') +
                    `${shadow(193, 160, 84, 6, .15)}<rect x="${X0 - 6}" y="${Y0 - 6}" width="162" height="112" rx="12" fill="#fff"/>` +
                    `<path d="${miss}" fill="#0f766e" opacity=".28"/><path d="${miss}" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 4" opacity=".8"/>` +
                    `<g mask="url(#pm-${u})">${pic}</g>${seams}` +
                    `<rect class="fb" style="opacity:0;animation:${ring} ${D} ease-out infinite" x="${X0 - 4}" y="${Y0 + S - 4}" width="${S + 8}" height="${S + 8}" rx="12" fill="none" stroke="#fff" stroke-width="3"/>` +
                    `<g class="fb" style="transform:translate(-80px,10px) rotate(-14deg);animation:${fly} ${D} linear infinite"><path d="${miss}" fill="#000" opacity=".18" transform="translate(3 5)"/><g clip-path="url(#pc-${u})">${pic}</g><path d="${miss}" fill="none" stroke="#fff" stroke-width="2"/></g>` +
                    `<g class="fb" style="opacity:0;animation:${sp} ${D} ease-out infinite">${spark(X0 - 6, Y0 + S - 2, 8, '#fde047')}${spark(X0 + S + 6, Y0 + 2 * S + 4, 7, '#fff')}${spark(X0 + 10, Y0 + 2 * S + 10, 5, '#fff')}</g>`,
                    `<linearGradient id="ps-${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient>` +
                    `<mask id="pm-${u}"><rect x="${X0}" y="${Y0}" width="150" height="100" rx="6" fill="#fff"/><path d="${miss}" fill="#000"/></mask><clipPath id="pc-${u}"><path d="${miss}"/></clipPath>`);
            },
            trivia(u) {
                let rays = ''; for (let i = 0; i < 12; i++) { const a = i * 30 * Math.PI / 180, b = a + 15 * Math.PI / 180; rays += `M160 150L${n1(160 + 400 * Math.cos(a))} ${n1(150 + 400 * Math.sin(a))}L${n1(160 + 400 * Math.cos(b))} ${n1(150 + 400 * Math.sin(b))}Z`; }
                let bulbs = ''; for (let i = 0; i < 20; i++) bulbs += `<circle class="a-blink" style="--d:.9s;--dl:${i % 2 ? '-.45s' : '0s'}" cx="${8 + i * 16}" cy="10" r="3.6" fill="#fff"/>`;
                const card = (x, y, rot, q, col, d, dl) => `<g transform="translate(${x} ${y}) rotate(${rot})"><g class="a-bob" style="--d:${d};--dl:${dl};--a:5px">${shadow(2, 44, 26, 4, .12)}<rect x="-28" y="-38" width="56" height="76" rx="11" fill="#fff"/><rect x="-23" y="-33" width="46" height="66" rx="8" fill="${col}" opacity=".14"/><text x="0" y="17" text-anchor="middle" font-size="46" fill="${col}">${q}</text></g></g>`;
                const D = '2.6s';
                const press = kf('tvPress', [[0, 'transform:translateY(0)'], [36, 'transform:translateY(0);animation-timing-function:ease-in'], [42, 'transform:translateY(6px);animation-timing-function:ease-out'], [56, 'transform:translateY(0)'], [100, 'transform:translateY(0)']]);
                const ring = kf('tvRing', [[0, 'transform:scale(1);opacity:0'], [41, 'transform:scale(1);opacity:0'], [44, 'transform:scale(1.05);opacity:.95'], [80, 'transform:scale(2.1);opacity:0'], [100, 'transform:scale(2.1);opacity:0']]);
                const zap = kf('tvZap', [[0, 'opacity:0;transform:scale(.6)'], [41, 'opacity:0;transform:scale(.6)'], [45, 'opacity:1;transform:scale(1)'], [64, 'opacity:0;transform:scale(1.15)'], [100, 'opacity:0;transform:scale(1.15)']]);
                const conf = [[30, '#ef4444', 4.2, 0], [70, '#3b82f6', 3.6, -1.2], [110, '#22c55e', 4.6, -2.4], [205, '#a855f7', 3.9, -.6], [240, '#f97316', 4.4, -3], [282, '#ec4899', 3.7, -1.8], [150, '#facc15', 5, -3.6], [300, '#22c55e', 4.1, -.2], [16, '#a855f7', 4.8, -2.9]]
                    .map(([x, c, d, dl], i) => `<rect class="a-fall" style="--d:${d}s;--dl:${dl}s" x="${x}" y="${-4 - (i % 3) * 6}" width="${i % 2 ? 5 : 7}" height="${i % 2 ? 9 : 5}" rx="1.5" fill="${c}"/>`).join('');
                return frame(u, '#fef9c3', '#fbcfe8',
                    `<g class="a-orbit" style="--d:36s;--ox:160px;--oy:150px"><path d="${rays}" fill="#fff" opacity=".35"/></g>` +
                    `<rect width="320" height="20" fill="#f472b6"/>${bulbs}` + conf +
                    card(64, 92, -12, '?', '#ec4899', '1.8s', '0s') + card(258, 88, 11, '?', '#f59e0b', '2.1s', '-.9s') +
                    `<g transform="translate(160 150)">${shadow(0, 36, 50, 6, .2)}` +
                    `<ellipse class="fb" style="opacity:0;animation:${ring} ${D} ease-out infinite" cx="0" cy="12" rx="40" ry="13" fill="none" stroke="#fff" stroke-width="3"/>` +
                    `<g class="fb" style="opacity:0;animation:${zap} ${D} ease-out infinite"><path d="M-44 -26L-34 -18M44 -26L34 -18M0 -50V-38M-26 -44L-20 -34M26 -44L20 -34" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>` +
                    `<rect x="-44" y="10" width="88" height="24" rx="10" fill="#334155"/><ellipse cx="0" cy="12" rx="44" ry="9" fill="#475569"/>` +
                    `<g style="animation:${press} ${D} linear infinite"><ellipse cx="0" cy="12" rx="32" ry="7" fill="#b91c1c"/><path d="M-32 12A32 28 0 0 1 32 12Z" fill="#ef4444"/><path d="M-32 12A32 7 0 0 0 32 12Z" fill="#dc2626"/><ellipse cx="-12" cy="-4" rx="9" ry="5" fill="#fff" opacity=".45" transform="rotate(-22 -12 -4)"/></g>` +
                    `<rect x="-44" y="26" width="88" height="3" fill="#fff" opacity=".12"/></g>`);
            }
        };

        /* ================= Page ================= */
        let uidN = 0;
        // Games without a built-in scene ship their own banner snippet (games/<id>/banner.html), loaded below.
        const banner = (g) => SCENES[g.id] ? SCENES[g.id](`${g.id.replace(/[^a-z0-9]/gi, '')}${++uidN}`) : `<div class="ext-banner" data-banner="${esc(g.id)}"></div>`;
        const bannerCache = {};
        function loadBanners() {
            document.querySelectorAll('.ext-banner[data-banner]').forEach(async (el) => {
                const id = el.dataset.banner;
                try {
                    bannerCache[id] = bannerCache[id] || fetch(`/games/${id}/banner.html`).then((r) => (r.ok ? r.text() : ''));
                    el.innerHTML = (await bannerCache[id]).replace(/<!--[\s\S]*?-->/g, '');
                    const svg = el.querySelector('svg');
                    if (svg) svg.classList.add('scene');
                } catch (e) { /* the card still works without its picture */ }
            });
        }
        const vars = (g) => { const m = META[g.id] || { from: '#a1a1aa', to: '#52525b' }; return `--from:${m.from};--to:${m.to}`; };
        const tagHtml = (g) => `<span class="tag">${g.tagIcon === 'live' ? '<span class="live" aria-hidden="true"></span>' : icon(g.tagIcon, 12)}${esc(g.tag)}</span>`;

        function cards() {
            const featured = GAMES.find((g) => g.id === FEATURED);
            const hero = document.getElementById('hero');
            hero.href = `/games/${featured.id}/`;
            hero.setAttribute('style', vars(featured));
            hero.setAttribute('aria-label', `${featured.name}: ${featured.desc}`);
            hero.innerHTML = `<div class="art">${banner(featured)}</div><div class="hero-body"><div class="hero-pills"><span class="pill new">${icon('sparkles', 13)}New</span><span class="pill soft">${icon('users', 13)}Family party</span></div>` +
                `<h3>${badge(featured.id, 40)}${esc(featured.name)}</h3><p>${esc(featured.pitch || featured.desc)}</p>` +
                `<span class="play-btn">${icon('play', 16)}Play now</span></div>`;

            document.getElementById('grid').innerHTML = GAMES.map((g) =>
                `<a class="game" href="/games/${g.id}/" style="${vars(g)}"><div class="art">${banner(g)}${tagHtml(g)}${g.isNew ? `<span class="newflag">${icon('sparkles', 11)}New</span>` : ''}<span class="go" aria-hidden="true">${icon('play', 16)}</span></div>` +
                `<div class="info"><div class="title">${badge(g.id, 28)}<b>${esc(g.name)}</b></div><span class="desc">${esc(g.desc)}</span><div class="scores" data-id="${g.id}"><span class="sk"></span><span class="sk"></span></div></div></a>`).join('');
            document.getElementById('count').textContent = `${GAMES.length} games`;
            loadBanners();

            const STEPS = [
                ['users', 'Tap Play together', 'Open any game and tap the Play together button.', 'kart'],
                ['send', 'Invite the family', 'Send the invite to a group chat or a DM.', 'trivia'],
                ['flag', 'Play at the same time', 'Same course for everyone, with a live scoreboard.', 'road'],
                ['trophy', 'Top the leaderboard', 'Every score counts toward the family records.', '2048']
            ];
            document.getElementById('grid').insertAdjacentHTML('beforeend', `<section class="together" aria-label="Play together"><div><h2>${icon('users', 20)}Play together</h2><p class="tsub">Every game here works with the whole family at once.</p></div><div class="steps">` +
                STEPS.map(([ic, t, d, id]) => { const m = META[id]; return `<div class="step"><span class="si" style="background:linear-gradient(135deg,${m.from},${m.to})">${icon(ic, 19)}</span><div><b>${t}</b><span>${d}</span></div></div>`; }).join('') + '</div></section>');
            document.getElementById('back').innerHTML = icon('back', 22);
            document.getElementById('lead-chip').insertAdjacentHTML('afterbegin', icon('users', 14));
            document.getElementById('note').insertAdjacentHTML('afterbegin', icon('trophy', 15));

            const style = document.createElement('style');
            style.textContent = KF.join('\n');
            document.head.appendChild(style);

            // Only animate the banners that are on screen.
            const arts = document.querySelectorAll('.art');
            if ('IntersectionObserver' in window) {
                const io = new IntersectionObserver((entries) => entries.forEach((e) => e.target.classList.toggle('run', e.isIntersecting)), { rootMargin: '60px 0px' });
                arts.forEach((a) => io.observe(a));
            } else arts.forEach((a) => a.classList.add('run'));
        }

        function draw(boards) {
            GAMES.forEach((g) => {
                const el = document.querySelector(`.scores[data-id="${g.id}"]`);
                if (!el) return;
                const b = boards && boards[g.id];
                const unit = g.id === 'four' ? ' wins' : g.id === 'word' ? ' pts' : '';
                if (b && b.top && b.top.length) {
                    el.innerHTML = `<span class="sc top" title="Family best"><span class="ico">${icon('trophy', 12)}</span><span class="nm">${esc(b.top[0].name)}</span><span class="pts">${fmt(b.top[0].score)}${unit}</span></span>` +
                        (b.mine ? `<span class="sc me"><span class="ico">${icon('user', 12)}</span><span class="nm">You</span><span class="pts">${fmt(b.mine.score)}${unit}</span></span>`
                            : `<span class="sc me"><span class="ico">${icon('user', 12)}</span><span class="nm">You haven’t played yet</span></span>`);
                } else if (boards) el.innerHTML = `<span class="sc first"><span class="ico">${icon('star', 12)}</span><span class="nm">No scores yet. Be the first!</span></span>`;
                else el.innerHTML = '';
            });
        }

        async function load() {
            const u = window.getChowaniecUser ? window.getChowaniecUser() : null;
            try {
                const res = await fetch('/.netlify/functions/games?boards=1', { headers: { 'X-Chowaniec-Key': (u && u.key) || '' }, cache: 'no-store' });
                if (res.ok) { draw((await res.json()).games); return; }
            } catch (e) { /* the cards still work without scores */ }
            draw(null);
        }

        cards();
        window.initializeProtectedContent = load;
        window.addEventListener('DOMContentLoaded', () => { if (window.isAppAuthorized && window.isAppAuthorized()) load(); });
    })();
    </script>
</body>
