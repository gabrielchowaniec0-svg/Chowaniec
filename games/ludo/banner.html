<!-- Race Home banner for /games/ (the die rolls a 4, a red token hops and sends a blue one home). Scoped CSS: every class starts with bn-ludo. -->
<style>
.bn-ludo { display: block; width: 100%; height: 100%; }
.bn-ludo [class^="bn-ludo-"] { transform-box: fill-box; transform-origin: center; }
.bn-ludo-tw { animation: bnLdTw var(--d, 2.4s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes bnLdTw { 0%, 100% { transform: scale(.3) rotate(0); opacity: .2; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
.bn-ludo-die { animation: bnLdDie 5s linear infinite; }
@keyframes bnLdDie {
  0% { transform: translate(-6px, -40px) rotate(-200deg); animation-timing-function: ease-in; }
  6% { transform: translate(-2px, 0) rotate(-60deg); animation-timing-function: ease-out; }
  10% { transform: translate(2px, -16px) rotate(-14deg); animation-timing-function: ease-in; }
  14% { transform: translate(0, 0) rotate(0) scale(1.08, .92); }
  17%, 86% { transform: translate(0, 0) rotate(0) scale(1); }
  94% { transform: translate(0, 0) rotate(0) scale(1); opacity: 1; }
  97% { transform: translate(-6px, -40px) rotate(-200deg); opacity: 0; }
  100% { transform: translate(-6px, -40px) rotate(-200deg); opacity: 1; }
}
.bn-ludo-dshadow { animation: bnLdSh 5s linear infinite; }
@keyframes bnLdSh { 0% { transform: scale(.5); opacity: .05; } 6% { transform: scale(1); opacity: .16; } 10% { transform: scale(.75); opacity: .1; } 14%, 100% { transform: scale(1); opacity: .16; } }
.bn-ludo-f6, .bn-ludo-f2, .bn-ludo-f5, .bn-ludo-f4 { opacity: 0; }
.bn-ludo-f6 { animation: bnLdF6 5s steps(1, end) infinite; }
.bn-ludo-f2 { animation: bnLdF2 5s steps(1, end) infinite; }
.bn-ludo-f5 { animation: bnLdF5 5s steps(1, end) infinite; }
.bn-ludo-f4 { animation: bnLdF4 5s steps(1, end) infinite; }
@keyframes bnLdF6 { 0% { opacity: 1; } 4% { opacity: 0; } 97% { opacity: 1; } }
@keyframes bnLdF2 { 0% { opacity: 0; } 4% { opacity: 1; } 8% { opacity: 0; } }
@keyframes bnLdF5 { 0% { opacity: 0; } 8% { opacity: 1; } 12% { opacity: 0; } }
@keyframes bnLdF4 { 0% { opacity: 0; } 12% { opacity: 1; } 97% { opacity: 0; } }
.bn-ludo-red { animation: bnLdRed 5s linear infinite; }
@keyframes bnLdRed {
  0%, 20% { transform: translate(0, 0); opacity: 1; }
  20% { transform: translate(0px, 0); animation-timing-function: ease-out; } 23% { transform: translate(6.2px, -9px); animation-timing-function: ease-in; } 26% { transform: translate(12.4px, 0); animation-timing-function: ease-out; } 29% { transform: translate(18.6px, -9px); animation-timing-function: ease-in; } 32% { transform: translate(24.8px, 0); animation-timing-function: ease-out; } 35% { transform: translate(31px, -9px); animation-timing-function: ease-in; } 38% { transform: translate(37.2px, 0); animation-timing-function: ease-out; } 41% { transform: translate(43.4px, -9px); animation-timing-function: ease-in; }
  44% { transform: translate(49.6px, 0) scale(1.15, .85); }
  47%, 86% { transform: translate(49.6px, 0) scale(1); opacity: 1; }
  93% { transform: translate(49.6px, 0) scale(.5); opacity: 0; }
  96% { transform: translate(0, 0) scale(.5); opacity: 0; }
  100% { transform: translate(0, 0) scale(1); opacity: 1; }
}
.bn-ludo-blue { animation: bnLdBlue 5s linear infinite; }
@keyframes bnLdBlue {
  0%, 43% { transform: translate(0, 0); animation-timing-function: ease-out; }
  50% { transform: translate(-8.7px, -6.7px) rotate(-200deg); animation-timing-function: ease-in; }
  57%, 90% { transform: translate(-17.4px, 54.6px) rotate(-360deg); opacity: 1; }
  94% { transform: translate(-17.4px, 54.6px) rotate(-360deg); opacity: 0; }
  96% { transform: translate(0, 0); opacity: 0; }
  100% { transform: translate(0, 0); opacity: 1; }
}
.bn-ludo-boom { opacity: 0; animation: bnLdBoom 5s ease-out infinite; }
@keyframes bnLdBoom { 0%, 42% { opacity: 0; transform: scale(.3); } 46% { opacity: 1; transform: scale(1.1); } 56%, 100% { opacity: 0; transform: scale(1.5); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bn-ludo { filter: saturate(.94) brightness(.9); } }
:root[data-theme="dark"] .bn-ludo { filter: saturate(.94) brightness(.9); }
@media (prefers-reduced-motion: reduce) { .bn-ludo * { animation: none !important; } .bn-ludo .bn-ludo-f4 { opacity: 1; } }
</style>
