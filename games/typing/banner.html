<!-- Type Racer banner: a standalone snippet (inline animated SVG + scoped CSS, class prefix .bn-typing).
     Drop it into any 16:10 box, e.g. the art area of a card on /games/. Light and dark aware. -->
<div class="bn-typing">
<style>
.bn-typing { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: inherit; background: linear-gradient(135deg, #e5e7eb, #334155); isolation: isolate; }
.bn-typing-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bn-typing text { font-family: Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 800; }
.bn-typing .bnt-scroll { animation: bntScroll .5s linear infinite; }
.bn-typing .bnt-spin { animation: bntSpin .35s linear infinite; }
.bn-typing .bnt-bob { animation: bntBob .18s ease-in-out infinite alternate; }
.bn-typing .bnt-drift { animation: bntDrift var(--d, 3s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
.bn-typing .bnt-puff { transform-box: fill-box; transform-origin: center; animation: bntPuff .7s ease-out infinite; animation-delay: var(--dl, 0s); }
.bn-typing .bnt-wave { transform-box: fill-box; transform-origin: 0 50%; animation: bntWave .7s ease-in-out infinite alternate; }
.bn-typing .bnt-ltr { opacity: 0; animation: 4s steps(1, end) infinite; }
.bn-typing .bnt-ltr:nth-of-type(1) { animation-name: bntL0; } .bn-typing .bnt-ltr:nth-of-type(2) { animation-name: bntL1; } .bn-typing .bnt-ltr:nth-of-type(3) { animation-name: bntL2; }
.bn-typing .bnt-ltr:nth-of-type(4) { animation-name: bntL3; } .bn-typing .bnt-ltr:nth-of-type(5) { animation-name: bntL4; }
.bn-typing .bnt-caret { animation: bntCaret 4s linear infinite; }
.bn-typing .bnt-key { animation: bntKey 4s ease-out infinite; animation-delay: calc(var(--k) * .32s); }
.bn-typing .bnt-tw { transform-box: fill-box; transform-origin: center; animation: bntTw var(--d, 2s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes bntScroll { from { transform: translateX(0); } to { transform: translateX(-32px); } }
@keyframes bntSpin { to { transform: rotate(360deg); } }
@keyframes bntBob { from { transform: translateY(-.8px); } to { transform: translateY(.8px); } }
@keyframes bntDrift { from { transform: translateX(calc(var(--a, 12px) * -1)); } to { transform: translateX(var(--a, 12px)); } }
@keyframes bntPuff { 0% { transform: translateX(0) scale(.4); opacity: .8; } 100% { transform: translateX(-14px) scale(1.5); opacity: 0; } }
@keyframes bntWave { from { transform: skewY(-6deg) scaleX(1); } to { transform: skewY(6deg) scaleX(.88); } }
@keyframes bntL0 { 0% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes bntL1 { 0% { opacity: 0; } 8% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes bntL2 { 0% { opacity: 0; } 16% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes bntL3 { 0% { opacity: 0; } 24% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes bntL4 { 0% { opacity: 0; } 32% { opacity: 1; } 92%, 100% { opacity: 0; } }
@keyframes bntCaret { 0%, 7.9% { transform: translateX(-68px); } 8%, 15.9% { transform: translateX(-51px); } 16%, 23.9% { transform: translateX(-34px); } 24%, 31.9% { transform: translateX(-17px); } 32%, 91.9% { transform: translateX(0); } 92%, 100% { transform: translateX(-85px); } }
@keyframes bntKey { 0% { transform: translateY(2px); } 6% { transform: translateY(0); } 100% { transform: translateY(0); } }
@keyframes bntTw { 0%, 100% { transform: scale(.25) rotate(0deg); opacity: .15; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bn-typing-scene { filter: saturate(.94) brightness(.9); } }
:root[data-theme="dark"] .bn-typing-scene { filter: saturate(.94) brightness(.9); }
@media (prefers-reduced-motion: reduce) { .bn-typing * { animation: none !important; } .bn-typing .bnt-ltr { opacity: 1; } }
</style>
