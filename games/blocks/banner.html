<!-- Block Drop banner: a standalone snippet (inline animated SVG + scoped CSS, class prefix .bn-blocks).
     Drop it into any 16:10 box, e.g. the art area of a card on /games/. Light and dark aware. -->
<div class="bn-blocks">
<style>
.bn-blocks { position: relative; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; border-radius: inherit; background: linear-gradient(135deg, #67e8f9, #7c3aed); isolation: isolate; }
.bn-blocks-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bn-blocks text { font-family: Outfit, system-ui, -apple-system, 'Segoe UI', sans-serif; font-weight: 800; }
.bn-blocks .bnb-fall { animation: bnbFall 4.8s linear infinite; }
.bn-blocks .bnb-ghost { animation: bnbGhost 4.8s linear infinite; }
.bn-blocks .bnb-row { transform-box: fill-box; transform-origin: center; animation: bnbRow 4.8s linear infinite; }
.bn-blocks .bnb-flash { opacity: 0; transform-box: fill-box; transform-origin: center; animation: bnbFlash 4.8s linear infinite; }
.bn-blocks .bnb-plus { opacity: 0; animation: bnbPlus 4.8s linear infinite; }
.bn-blocks .bnb-send { opacity: 0; animation: bnbSend 4.8s linear infinite; }
.bn-blocks .bnb-two { opacity: 0; animation: bnbTwo 4.8s linear infinite; }
.bn-blocks .bnb-rise { animation: bnbRise 4.8s linear infinite; }
.bn-blocks .bnb-bob { animation: bnbBob 2.2s ease-in-out infinite alternate; }
.bn-blocks .bnb-tw { transform-box: fill-box; transform-origin: center; animation: bnbTw var(--d, 2s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes bnbFall { 0% { transform: translateY(-150px); opacity: 1; } 34% { transform: translateY(0); animation-timing-function: ease-out; } 37% { transform: translateY(-3px); } 40% { transform: translateY(0); } 55% { opacity: 1; } 62% { opacity: 0; } 95% { transform: translateY(0); opacity: 0; } 95.1% { transform: translateY(-150px); opacity: 0; } 100% { transform: translateY(-150px); opacity: 1; } }
@keyframes bnbGhost { 0%, 30% { opacity: 1; } 34%, 94% { opacity: 0; } 100% { opacity: 1; } }
@keyframes bnbRow { 0%, 54% { transform: scaleX(1); opacity: 1; } 62% { transform: scaleX(0); opacity: 0; } 88% { transform: scaleX(0); opacity: 0; } 96%, 100% { transform: scaleX(1); opacity: 1; } }
@keyframes bnbFlash { 0%, 44% { opacity: 0; transform: scaleX(1); } 50% { opacity: .9; } 62% { opacity: 0; transform: scaleX(.2); } 100% { opacity: 0; } }
@keyframes bnbPlus { 0%, 54% { opacity: 0; transform: translateY(6px); } 60% { opacity: 1; transform: translateY(0); } 76% { opacity: 1; transform: translateY(-10px); } 84%, 100% { opacity: 0; transform: translateY(-16px); } }
@keyframes bnbSend { 0%, 58% { opacity: 0; transform: translate(0, 0) scale(.6); } 62% { opacity: 1; transform: translate(0, 0) scale(1); } 74% { opacity: 1; transform: translate(24px, 30px) scale(.8); } 78%, 100% { opacity: 0; transform: translate(28px, 34px) scale(.5); } }
@keyframes bnbTwo { 0%, 70% { opacity: 0; transform: translateY(4px); } 74% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
@keyframes bnbRise { 0%, 72% { transform: translateY(0); } 80% { transform: translateY(-10px); } 96% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
@keyframes bnbBob { from { transform: translateY(-4px) rotate(-2deg); } to { transform: translateY(4px) rotate(2deg); } }
@keyframes bnbTw { 0%, 100% { transform: scale(.25) rotate(0deg); opacity: .15; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bn-blocks-scene { filter: saturate(.94) brightness(.9); } }
:root[data-theme="dark"] .bn-blocks-scene { filter: saturate(.94) brightness(.9); }
@media (prefers-reduced-motion: reduce) { .bn-blocks *, .bn-blocks *::before { animation: none !important; } }
</style>
