<!DOCTYPE html>
<html lang="en" class="ch-ui ch-refresh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Notifications</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/design.css">
    <link rel="stylesheet" href="/design-extra.css">
    <script src="/theme.js"></script>

    <script src="/pwa.js" defer></script>
    <!-- Tailwind is only used by the shared passcode box -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="../../passwords.js"></script>
    <script src="../../auth-gate.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/settings/settings.css">
</head>
<body>
<div id="app-root">
    <div class="ch-glow" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="ch-header">
        <div class="ch-header__bar">
            <a class="ch-iconbtn" href="/settings/" aria-label="Back to Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></a>
            <span class="ch-header__small" aria-hidden="true">Notifications</span>
        </div>
        <h1 class="ch-header__title">Notifications</h1>
    </header>

    <main class="wrap">
        <!-- Turn on / status -->
        <section class="card hero" id="status-card" aria-live="polite"></section>

        <!-- What to hear about -->
        <section class="card" aria-labelledby="h-what">
            <h2 id="h-what">What to hear about</h2>
            <p class="lead" style="margin-bottom:6px">This is your own choice and follows you to every device.</p>
            <div role="radiogroup" aria-labelledby="h-what" id="what">
                <label class="choice"><input type="radio" name="what" value="all">
                    <span><span class="t" style="font-weight:500;display:block">Everything</span><span class="s" style="color:var(--muted);font-size:13px">New group messages, @mentions and replies from Chowaniec AI.</span></span></label>
                <label class="choice"><input type="radio" name="what" value="mentions">
                    <span><span class="t" style="font-weight:500;display:block">Only when I&rsquo;m mentioned</span><span class="s" style="color:var(--muted);font-size:13px">@you, @everyone and replies to you. No notice for ordinary messages.</span></span></label>
                <label class="choice"><input type="radio" name="what" value="off">
                    <span><span class="t" style="font-weight:500;display:block">Nothing</span><span class="s" style="color:var(--muted);font-size:13px">Stay signed up, but don&rsquo;t send me any notifications.</span></span></label>
            </div>
        </section>

        <!-- Quiet hours -->
        <section class="card" aria-labelledby="h-quiet">
            <h2 id="h-quiet">Quiet hours</h2>
            <div class="row">
                <div class="grow"><div class="t"><label for="sw-quiet">Pause notifications at night</label></div>
                    <div class="s">Nothing is sent to you during these hours. Messages are still waiting in the chat.</div></div>
                <span class="switch"><input type="checkbox" id="sw-quiet" role="switch"><span class="track"></span></span>
            </div>
            <div id="quiet-times" class="hidden">
                <div class="times">
                    <label class="timefield" for="q-start">From<input type="time" id="q-start"></label>
                    <label class="timefield" for="q-end">Until<input type="time" id="q-end"></label>
                </div>
                <p class="s" style="color:var(--muted);font-size:13px;margin-top:10px" id="q-zone"></p>
            </div>
        </section>

        <!-- Devices -->
        <section class="card devices" id="devices" aria-labelledby="h-dev">
            <h2 id="h-dev">Your devices</h2>
            <p class="lead">Phones and computers that get your notifications.</p>
            <div id="dev-list"></div>
        </section>
    </main>
</div>
<script src="/settings/settings.js"></script>
<script>
(function () {
    var S = window.ChowaniecSettings, $ = S.$, esc = S.esc;
    var pwa = null, settings = null, zone = 'America/New_York';
    try { zone = Intl.DateTimeFormat().resolvedOptions().timeZone || zone; } catch (e) {}

    // ---------- status card ----------
    var IC = {
        bell: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.27 21a2 2 0 0 0 3.46 0M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/></svg>',
        check: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.8 10A10 10 0 1 1 17 3.34"/><path d="m9 11 3 3L22 4"/></svg>',
        off: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.27 21a2 2 0 0 0 3.46 0M17 17H4a1 1 0 0 1-.74-1.67C4.59 13.96 6 12.5 6 8a6 6 0 0 1 .26-1.74M8.67 3.03A6 6 0 0 1 18 8c0 1.5.15 2.68.4 3.65M2 2l20 20"/></svg>',
        phone: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M12 18h.01"/></svg>',
        info: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>',
        warn: '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4M12 17h.01"/></svg>'
    };
    function card(bell, title, text, extra) {
        $('status-card').innerHTML = '<div class="bell" aria-hidden="true">' + bell + '</div><h3>' + title + '</h3><p>' + text + '</p>' + (extra || '');
    }

    function platformSteps(st) {
        var plat = pwa.platform();
        if (st === 'needs-install') {
            return '<ol class="steps"><li>Open this website in <b>Safari</b>.</li><li>Tap the <b>Share</b> button, then <b>Add to Home Screen</b>.</li><li>Open Chowaniec from your home screen and come back to this page.</li></ol>' +
                '<div class="actions"><a class="btn solid" href="/get-the-app/">Show me how to install</a></div>';
        }
        if (plat === 'ios') return '<ol class="steps"><li>Open the <b>Settings</b> app on your iPhone.</li><li>Scroll to <b>Notifications</b> and find <b>Chowaniec</b>.</li><li>Turn on <b>Allow Notifications</b>, then come back and refresh this page.</li></ol>';
        if (plat === 'android') return '<ol class="steps"><li>Open the <b>lock icon</b> or <b>&#8942; menu</b> next to the web address.</li><li>Tap <b>Permissions</b> (or <b>Site settings</b>) and then <b>Notifications</b>.</li><li>Choose <b>Allow</b>, then refresh this page.</li></ol>';
        return '<ol class="steps"><li>Click the <b>lock icon</b> next to the web address.</li><li>Find <b>Notifications</b> and switch it to <b>Allow</b>.</li><li>Refresh this page.</li></ol>';
    }

    async function paintStatus() {
        var st;
        try { st = await pwa.pushStatus(); } catch (e) { st = 'error'; }
        var el = $('status-card');
        if (st === 'disabled') {
            card(IC.bell, 'Turn on notifications on this device?',
                'You&rsquo;ll hear about new family messages and @mentions, even when the app is closed. Your browser will ask you to confirm.',
                '<div class="actions"><button type="button" class="btn solid" id="btn-yes">Yes, turn them on</button></div>');
            $('btn-yes').addEventListener('click', async function () {
                var b = $('btn-yes');
                b.disabled = true; b.textContent = 'Waiting for your browser…';
                var r = await pwa.enablePush();   // opens the browser's own "Allow notifications?" box
                if (r === 'enabled') {
                    S.toast('Notifications are on');
                    sendTest(true);
                } else if (r === 'denied') S.toast('Notifications were blocked. You can change that in your browser.', true);
                else S.toast('That didn’t work. Please try again.', true);
                await paintStatus(); await paintDevices();
            });
        } else if (st === 'enabled') {
            card(IC.check, 'Notifications are on', 'This device will get the notifications you choose below.',
                '<div class="actions"><button type="button" class="btn" id="btn-test">Send me a test</button><button type="button" class="btn danger" id="btn-off">Turn off on this device</button></div>');
            $('btn-test').addEventListener('click', function () { sendTest(false); });
            $('btn-off').addEventListener('click', async function () {
                $('btn-off').disabled = true;
                await pwa.disablePush();
                S.toast('Notifications are off on this device.');
                await paintStatus(); await paintDevices();
            });
        } else if (st === 'denied') {
            card(IC.off, 'Notifications are blocked', 'Your browser is set to block notifications from Chowaniec, so the box can&rsquo;t appear. Switch it back on like this:', platformSteps(st));
        } else if (st === 'needs-install') {
            card(IC.phone, 'Install the app first', 'On iPhone and iPad, notifications only work after Chowaniec is added to your home screen.', platformSteps(st));
        } else if (st === 'unsupported') {
            card(IC.info, 'This browser can&rsquo;t do notifications', 'Try Chrome, Edge, Firefox or Safari (added to your home screen on iPhone).');
        } else if (st === 'not-configured') {
            var info = await pwa.serverInfo();
            var miss = (info.missing || []).map(function (n) { return '<code>' + esc(n) + '</code>'; }).join(' and ');
            card(IC.info, 'Notifications aren&rsquo;t set up on the server yet',
                miss ? 'The website can&rsquo;t see ' + miss + '. In Netlify, open <b>Site configuration &rarr; Environment variables</b>, make sure each one is available to <b>Functions</b> for <b>Production</b>, then press <b>Deploys &rarr; Trigger deploy</b>. Netlify only applies changes to new deploys.' :
                'The server isn&rsquo;t reporting its notification keys. Try again in a minute.');
        } else {
            card(IC.warn, 'Couldn&rsquo;t check right now', 'Your connection or sign-in may have hiccuped.',
                '<div class="actions"><button type="button" class="btn solid" id="btn-retry">Try again</button></div>');
            $('btn-retry').addEventListener('click', paintStatus);
        }
    }

    async function sendTest(quiet) {
        try {
            var r = await pwa.sendTestPush();
            if (!quiet || r.sent) S.toast(r.sent ? 'Test sent — it should arrive in a moment.' : 'No device is signed up yet.', !r.sent);
        } catch (e) { if (!quiet) S.toast(e.message, true); }
    }

    // ---------- choices (saved to the server) ----------
    // Changes made close together are sent as one save, so a quick second tap never cancels the first.
    var saveTimer = null, pending = { notifications: { quietHours: {} } };
    function save(patch) {
        var n = patch.notifications || {};
        Object.keys(n).forEach(function (k) {
            if (k === 'quietHours') Object.assign(pending.notifications.quietHours, n[k]);
            else pending.notifications[k] = n[k];
        });
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async function () {
            var send = pending;
            pending = { notifications: { quietHours: {} } };
            try {
                var r = await S.api('/.netlify/functions/settings', { method: 'POST', body: { settings: send } });
                settings = r.settings;
                S.toast('Saved');
            } catch (e) { S.toast(e.message, true); }
        }, 250);
    }

    function paintChoices() {
        var n = settings.notifications;
        document.querySelectorAll('input[name="what"]').forEach(function (r) { r.checked = r.value === n.messages; });
        $('sw-quiet').checked = n.quietHours.on;
        $('q-start').value = n.quietHours.start;
        $('q-end').value = n.quietHours.end;
        $('quiet-times').classList.toggle('hidden', !n.quietHours.on);
        $('q-zone').textContent = 'Times use your time zone (' + n.quietHours.tz.replace(/_/g, ' ') + ').';
    }

    function wireChoices() {
        $('what').addEventListener('change', function (e) {
            if (e.target.name !== 'what') return;
            settings.notifications.messages = e.target.value;
            save({ notifications: { messages: e.target.value } });
        });
        $('sw-quiet').addEventListener('change', function (e) {
            var on = e.target.checked;
            settings.notifications.quietHours.on = on;
            if (on) settings.notifications.quietHours.tz = zone;
            $('quiet-times').classList.toggle('hidden', !on);
            paintChoices();
            save({ notifications: { quietHours: { on: on, tz: zone } } });
        });
        ['q-start', 'q-end'].forEach(function (id) {
            $(id).addEventListener('change', function () {
                var start = $('q-start').value, end = $('q-end').value;
                if (!start || !end) return;
                save({ notifications: { quietHours: { start: start, end: end, tz: zone } } });
            });
        });
    }

    // ---------- devices ----------
    function deviceName(ua) {
        ua = ua || '';
        var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android phone' : /Windows/.test(ua) ? 'Windows computer' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux computer' : 'Device';
        var br = /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /Chrome\//.test(ua) || /CriOS/.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : '';
        return br ? os + ' · ' + br : os;
    }

    async function thisDeviceId() {
        try {
            var reg = await navigator.serviceWorker.ready;
            var sub = await reg.pushManager.getSubscription();
            if (!sub) return null;
            var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(sub.endpoint));
            return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('').slice(0, 32);
        } catch (e) { return null; }
    }

    async function paintDevices() {
        var list = $('dev-list');
        try {
            var d = await S.api('/.netlify/functions/push?devices=1');
            var mine = await thisDeviceId();
            if (!d.devices.length) { list.innerHTML = '<p class="s" style="color:var(--muted)">No devices yet. Turn on notifications above to add this one.</p>'; return; }
            list.innerHTML = d.devices.map(function (x) {
                var when = x.savedAt ? new Date(x.savedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
                return '<div class="dev"><div class="grow" style="flex:1;min-width:0"><div class="t" style="font-weight:500">' + esc(deviceName(x.userAgent)) + (x.id === mine ? ' <span class="pill">This device</span>' : '') + '</div>' +
                    '<div class="s" style="color:var(--muted);font-size:13px">Added ' + esc(when) + '</div></div>' +
                    '<button type="button" class="btn danger" data-remove="' + esc(x.id) + '">Remove</button></div>';
            }).join('');
        } catch (e) { list.innerHTML = '<p class="s" style="color:var(--muted)">Couldn&rsquo;t load your devices.</p>'; }
    }

    async function start() {
        pwa = window.ChowaniecPWA;
        $('dev-list').addEventListener('click', async function (e) {
            var b = e.target.closest('[data-remove]');
            if (!b) return;
            b.disabled = true;
            try {
                if (b.dataset.remove === await thisDeviceId()) await pwa.disablePush();
                else await S.api('/.netlify/functions/push', { method: 'DELETE', body: { id: b.dataset.remove } });
                S.toast('Device removed.');
            } catch (err) { S.toast(err.message, true); }
            await paintDevices(); await paintStatus();
        });
        paintStatus();
        paintDevices();
        try {
            var r = await S.api('/.netlify/functions/settings');
            settings = r.settings;
            paintChoices();
            wireChoices();
        } catch (e) { console.error('choices', e); S.toast('Couldn’t load your saved choices.', true); }
        window.addEventListener('chowaniec-pwa-change', paintStatus);
    }
    S.whenSignedIn(start);
})();
</script>
</body>
</html>
