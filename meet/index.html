<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chowaniec Meet</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
  <!-- Daily.co SDK -->
  <script src="https://unpkg.com/@daily-co/daily-js@0.93.0/dist/daily.js"></script>
  <!-- Security Gate & Passcodes -->
  <script src="../passwords.js"></script>
  <script src="../auth-gate.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #202124;
      color: #e8eaed;
      overflow: hidden;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .meet-btn {
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .meet-btn:hover {
      transform: scale(1.06);
    }
    .meet-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between selection:bg-sky-500/20 relative">

  <!-- Application Shell targeted by auth-gate.js -->
  <div id="app-root" class="flex-1 flex flex-col h-full w-full justify-between transition-all duration-500">

    <!-- Top HUD Bar -->
    <header class="h-16 px-6 flex justify-between items-center z-10 bg-[#202124] border-b border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-black font-semibold text-xs">
          CM
        </div>
        <span class="text-sm font-medium tracking-wide text-zinc-200">Production Call</span>
        <span class="text-zinc-600">|</span>
        <span id="active-code-display" class="text-xs font-mono text-zinc-400">ID: production</span>
        <span class="text-zinc-600">|</span>
        <span id="clock" class="text-xs font-mono text-zinc-400">00:00 PM</span>
      </div>

      <!-- Live Ranks Display -->
      <div class="flex items-center gap-2" id="authority-pills">
        <span id="director-badge" class="hidden text-[11px] font-mono px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300">
          Director: <strong id="director-name">Vacant</strong>
        </span>
        <span id="co-director-badge" class="hidden text-[11px] font-mono px-3 py-1 rounded-full bg-sky-500/10 border border-sky-500/20 text-sky-300">
          Co-Director: <strong id="co-director-name">Vacant</strong>
        </span>
        <span class="text-[11px] font-mono px-3 py-1 rounded-full bg-white/5 border border-white/10 text-zinc-300">
          Guests: <strong id="guest-count">0/4</strong>
        </span>
      </div>
    </header>

    <!-- Main Stage / Video Area -->
    <main class="flex-1 p-4 relative flex gap-4 overflow-hidden">
      <div id="video-stage" class="flex-1 h-full rounded-2xl overflow-hidden bg-[#18191b] border border-white/5 relative flex items-center justify-center">
        <div id="daily-container" class="w-full h-full"></div>
      </div>

      <!-- Right Activities Drawer -->
      <aside id="side-drawer" class="w-80 h-full bg-[#282a2d] border border-white/10 rounded-2xl flex flex-col justify-between hidden p-5 shadow-2xl transition-all">
        <div class="flex items-center justify-between border-b border-white/10 pb-4">
          <h3 id="drawer-title" class="text-sm font-semibold text-white tracking-wide">Activities</h3>
          <button onclick="toggleDrawer(null)" class="w-8 h-8 rounded-full hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div id="drawer-body" class="flex-1 py-4 overflow-y-auto space-y-4"></div>
      </aside>
    </main>

    <!-- Bottom Controls -->
    <footer class="h-20 px-6 flex items-center justify-between border-t border-white/5 bg-[#202124]">
      <div class="hidden sm:flex items-center gap-2 text-xs font-mono text-zinc-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span id="current-user-role-label">Ready</span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <button id="btn-mic" onclick="toggleAudio()" class="meet-btn w-12 h-12 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white shadow-md">
          <i data-lucide="mic" id="icon-mic" class="w-5 h-5"></i>
        </button>

        <button id="btn-cam" onclick="toggleVideo()" class="meet-btn w-12 h-12 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white shadow-md">
          <i data-lucide="video" id="icon-cam" class="w-5 h-5"></i>
        </button>

        <button id="btn-share" onclick="toggleScreenShare()" class="meet-btn w-12 h-12 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white shadow-md">
          <i data-lucide="screen-share" id="icon-share" class="w-5 h-5"></i>
        </button>

        <button onclick="leaveMeeting()" class="meet-btn px-6 h-12 rounded-full bg-red-600 hover:bg-red-500 text-white font-medium flex items-center justify-center gap-2 shadow-lg">
          <i data-lucide="phone-off" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Activities Controls -->
      <div class="flex items-center gap-2">
        <button onclick="copyInviteLink()" title="Copy Meeting Link" class="meet-btn w-10 h-10 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white">
          <i data-lucide="link-2" class="w-4 h-4"></i>
        </button>

        <button onclick="toggleDrawer('polls')" title="Quick Polls" class="meet-btn w-10 h-10 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white">
          <i data-lucide="bar-chart-2" class="w-4 h-4"></i>
        </button>

        <button onclick="toggleDrawer('forms')" title="Push Production Form" class="meet-btn w-10 h-10 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white">
          <i data-lucide="clipboard-list" class="w-4 h-4"></i>
        </button>

        <button onclick="toggleDrawer('roster')" title="Role Delegations" class="meet-btn w-10 h-10 rounded-full bg-[#3c4043] hover:bg-[#474a4d] flex items-center justify-center text-white">
          <i data-lucide="users" class="w-4 h-4"></i>
        </button>
      </div>
    </footer>
  </div>

  <!-- Pre-Join Lobby -->
  <div id="lobby-screen" class="fixed inset-0 bg-[#202124]/95 backdrop-blur-md z-40 flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#282a2d] border border-white/10 p-8 rounded-3xl shadow-2xl space-y-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center text-black font-semibold text-sm">
            CP
          </div>
          <div>
            <h2 class="text-xl font-medium text-white tracking-wide">Chowaniec Meet</h2>
            <p class="text-xs text-zinc-400 font-light">Theater & Production Stage</p>
          </div>
        </div>
        <span id="lobby-code-badge" class="hidden text-xs font-mono px-3 py-1 bg-white/5 border border-white/10 rounded-full text-sky-400">
          Room Linked
        </span>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-mono text-zinc-400 uppercase tracking-widest mb-1.5">Your Name</label>
          <input type="text" id="user-name-input" placeholder="Your name" class="w-full bg-[#1e1f22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-sky-400 outline-none transition-all">
          <p id="host-hint" class="text-[11px] text-zinc-500 mt-1">Host priority is based on the passcode you signed in with.</p>
        </div>

        <div>
          <label class="block text-xs font-mono text-zinc-400 uppercase tracking-widest mb-1.5">Meeting Code</label>
          <div class="relative">
            <input type="text" id="room-code-input" placeholder="abc-defg-hij" value="production" class="w-full bg-[#1e1f22] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-sky-400 outline-none font-mono text-xs transition-all">
          </div>
          <p id="room-subtext" class="text-[11px] text-zinc-500 mt-1">Room code will be appended to invite links.</p>
        </div>
      </div>

      <div class="space-y-3">
        <button onclick="joinMeeting()" class="w-full py-3.5 rounded-full bg-white hover:bg-zinc-200 text-black font-medium text-sm transition-all shadow-lg flex items-center justify-center gap-2">
          <span>Enter Studio</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
        <button id="new-meeting-btn" onclick="createNewMeeting()" class="w-full py-3.5 rounded-full bg-transparent border border-white/15 hover:bg-white/5 text-white font-medium text-sm transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-wait">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span id="new-meeting-label">New Meeting</span>
        </button>
        <p id="new-meeting-error" class="hidden text-[11px] text-red-400 text-center"></p>
      </div>
    </div>
  </div>

  <!-- Real-time Popup for Broadcast Forms / Polls -->
  <div id="broadcast-popup" class="fixed bottom-24 left-8 max-w-sm w-full bg-[#282a2d] border border-sky-400/40 rounded-2xl p-5 shadow-2xl z-40 hidden">
    <div class="flex justify-between items-start mb-3">
      <span class="text-xs font-mono uppercase tracking-widest text-sky-400 font-semibold" id="popup-badge">Production Alert</span>
      <button onclick="hideBroadcastPopup()" class="text-zinc-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
    <div id="popup-content" class="space-y-3"></div>
  </div>

  <!-- Floating Return Button -->
  <button onclick="returnToHub()" title="Return to Hub" class="fixed bottom-8 right-8 w-14 h-14 bg-[#282a2d] border border-white/10 shadow-xl rounded-full flex items-center justify-center text-zinc-400 hover:text-white hover:bg-[#3c4043] hover:scale-105 transition-all z-50">
    <i data-lucide="arrow-left" class="w-5 h-5"></i>
  </button>

  <script>
    const DAILY_DOMAIN = 'chowaniec.daily.co';
    const ROOM_NAME_PATTERN = /^[A-Za-z0-9_-]{1,128}$/;
    const MAX_GUESTS = 4;

    let callFrame = null;
    let isLeaving = false;
    let localUserName = '';
    let currentMeetingCode = 'production';
    let currentDrawerTab = null;
    let isAudioMuted = false;
    let isVideoMuted = false;
    let isScreenSharing = false;
    let warnedGuestLimit = false;

    // Derived from the participant list on every change, so every client agrees.
    let sessionRoles = {
      director: null,
      coDirector: null,
      guests: []
    };

    let productionForms = [
      {
        id: 'scene-review',
        title: 'Episode 1 Scene 3 Approval',
        fields: ['Lighting Quality (1-10)', 'Audio Sync Status', 'Director Notes']
      },
      {
        id: 'gear-check',
        title: 'Stage Gear Checklist',
        fields: ['Boom Mic Position', 'Lens Aperture Set', 'SD Card Backed Up']
      }
    ];

    let activePoll = null;      // poll received from the Director / Co-Director
    let activeForm = null;      // form received from the Director / Co-Director
    let myPoll = null;          // poll this user launched, with live votes
    let formResponses = [];     // responses sent back to this user

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function returnToHub() {
      const isLocal =
        window.location.protocol === 'file:' ||
        window.location.hostname === 'localhost' ||
        window.location.hostname === '127.0.0.1';
      window.location.href = isLocal ? '../index.html' : '/';
    }

    function parseMeetingCodeFromUrl() {
      const search = window.location.search.replace(/^\?/, '').trim();
      if (!search) return;

      let extractedCode = search;
      if (search.includes('=')) {
        const params = new URLSearchParams(window.location.search);
        extractedCode = params.get('room') || params.get('id') || search.split('=')[1];
      }
      extractedCode = decodeURIComponent(extractedCode || '');

      if (extractedCode) {
        currentMeetingCode = extractedCode;
        const codeInput = document.getElementById('room-code-input');
        if (codeInput) {
          codeInput.value = extractedCode;
          codeInput.disabled = true;
          codeInput.classList.add('opacity-75', 'bg-black/40');
        }
        document.getElementById('lobby-code-badge').classList.remove('hidden');
        document.getElementById('active-code-display').innerText = `ID: ${extractedCode}`;
        document.getElementById('room-subtext').innerText = `Direct join code detected: ${extractedCode}`;
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    // --- Lobby ---

    function setLobbyError(message) {
      const errorEl = document.getElementById('new-meeting-error');
      if (message) {
        errorEl.innerText = message;
        errorEl.classList.remove('hidden');
      } else {
        errorEl.classList.add('hidden');
      }
    }

    function setLobbyBusy(busy) {
      document.querySelectorAll('#lobby-screen button').forEach((btn) => { btn.disabled = busy; });
    }

    function showLobby(message) {
      document.getElementById('lobby-screen').classList.remove('hidden');
      setLobbyBusy(false);
      setLobbyError(message);
    }

    function signedInKey() {
      const user = window.getChowaniecUser();
      return (user && user.key) || '';
    }

    function normalizeMeetingCode(raw) {
      if (/^https?:\/\//i.test(raw)) {
        try {
          return new URL(raw).pathname.split('/').filter(Boolean).pop() || '';
        } catch (e) {
          return '';
        }
      }
      return raw;
    }

    // Returns a Daily meeting token, null to try joining without one, or throws a user-facing error.
    async function fetchMeetingToken(room) {
      let res;
      try {
        res = await fetch('/.netlify/functions/meeting-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Chowaniec-Key': signedInKey() },
          body: JSON.stringify({ room, userName: localUserName })
        });
      } catch (e) {
        return null; // functions unavailable (e.g. opened locally); public rooms still work
      }
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.token) return data.token;
      if (res.status === 400 || res.status === 401) throw new Error(data.error);
      return null;
    }

    function describeJoinError(err, room) {
      const msg = String((err && (err.errorMsg || err.message)) || err || '');
      if (/does not exist|no such room|not found/i.test(msg)) return `No meeting found with code "${room}".`;
      if (/not allowed|private|token|permission/i.test(msg)) return 'You are not authorized to join this meeting. Try signing in again.';
      if (/full|max/i.test(msg)) return 'This meeting is full.';
      return 'Could not join the meeting. Please check the code and try again.';
    }

    async function joinMeeting() {
      const nameInput = document.getElementById('user-name-input').value.trim();
      const codeInput = normalizeMeetingCode(document.getElementById('room-code-input').value.trim());

      if (!nameInput) {
        alert("Please enter your name.");
        return;
      }
      if (!ROOM_NAME_PATTERN.test(codeInput)) {
        alert("Please enter a valid meeting code (letters, numbers, dashes and underscores).");
        return;
      }

      localUserName = nameInput;
      currentMeetingCode = codeInput;
      setLobbyError(null);
      setLobbyBusy(true);

      let token;
      try {
        token = await fetchMeetingToken(codeInput);
      } catch (err) {
        showLobby(err.message);
        return;
      }

      document.getElementById('active-code-display').innerText = `ID: ${currentMeetingCode}`;
      document.getElementById('lobby-screen').classList.add('hidden');

      callFrame = window.DailyIframe.createFrame(document.getElementById('daily-container'), {
        iframeStyle: {
          width: '100%',
          height: '100%',
          border: '0',
          borderRadius: '1rem',
          backgroundColor: '#18191b'
        },
        showLeaveButton: false,
        showFullscreenButton: false
      });

      callFrame.on('joined-meeting', handleMeetingJoined);
      callFrame.on('participant-joined', refreshRoles);
      callFrame.on('participant-left', refreshRoles);
      callFrame.on('participant-updated', handleParticipantUpdated);
      callFrame.on('app-message', handleAppMessage);
      callFrame.on('left-meeting', handleLeftMeeting);
      callFrame.on('error', (evt) => endCall(describeJoinError(evt, currentMeetingCode)));

      const joinOptions = { url: `https://${DAILY_DOMAIN}/${codeInput}`, userName: localUserName };
      if (token) joinOptions.token = token;

      try {
        await callFrame.join(joinOptions);
        history.replaceState(null, '', `${window.location.pathname}?${encodeURIComponent(currentMeetingCode)}`);
      } catch (err) {
        endCall(describeJoinError(err, codeInput));
      }
    }

    async function createNewMeeting() {
      const nameInput = document.getElementById('user-name-input').value.trim();
      if (!nameInput) {
        alert("Please enter your name.");
        return;
      }

      const label = document.getElementById('new-meeting-label');
      setLobbyError(null);
      setLobbyBusy(true);
      label.innerText = 'Creating...';

      try {
        const res = await fetch('/.netlify/functions/create-meeting', {
          method: 'POST',
          headers: { 'X-Chowaniec-Key': signedInKey() }
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.code) {
          throw new Error(data.error || 'Could not create a meeting. Please try again.');
        }

        document.getElementById('room-code-input').value = data.code;
        await joinMeeting();
      } catch (err) {
        showLobby(err.message);
      } finally {
        label.innerText = 'New Meeting';
      }
    }

    // Tears down the call frame and returns to the lobby with a message.
    function endCall(message) {
      if (callFrame) {
        const frame = callFrame;
        callFrame = null;
        frame.destroy().catch(() => {});
      }
      sessionRoles = { director: null, coDirector: null, guests: [] };
      myPoll = null;
      formResponses = [];
      toggleDrawer(null);
      updateAuthorityUI();
      showLobby(message);
    }

    function handleLeftMeeting() {
      if (isLeaving) return;
      endCall('You were disconnected from the meeting.');
    }

    function copyInviteLink() {
      const inviteUrl = `${window.location.origin}/meet?${encodeURIComponent(currentMeetingCode)}`;
      if (!navigator.clipboard) {
        prompt('Copy this meeting link:', inviteUrl);
        return;
      }
      navigator.clipboard.writeText(inviteUrl).then(
        () => alert(`Meeting link copied:\n${inviteUrl}`),
        () => prompt('Copy this meeting link:', inviteUrl)
      );
    }

    // --- Roles ---

    function joinedTime(p) {
      return p.joined_at ? new Date(p.joined_at).getTime() : Number.MAX_SAFE_INTEGER;
    }

    // Director: first host (room owner) to join, otherwise the first person to join.
    // Co-Director: the next person to join. Everyone else is a guest.
    function refreshRoles() {
      if (!callFrame) return;
      const people = Object.values(callFrame.participants()).sort(
        (a, b) => joinedTime(a) - joinedTime(b) || a.session_id.localeCompare(b.session_id)
      );
      const director = people.find((p) => p.owner) || people[0] || null;
      const others = people.filter((p) => p !== director);
      const previousRoles = JSON.stringify(sessionRoles);

      sessionRoles = {
        director: director && { id: director.session_id, name: director.user_name || 'Guest' },
        coDirector: others[0] ? { id: others[0].session_id, name: others[0].user_name || 'Guest' } : null,
        guests: others.slice(1).map((p) => ({ id: p.session_id, name: p.user_name || 'Guest' }))
      };

      const myId = localSessionId();
      const myGuestIndex = sessionRoles.guests.findIndex((g) => g.id === myId);
      if (myGuestIndex >= MAX_GUESTS && !warnedGuestLimit) {
        warnedGuestLimit = true;
        alert(`Maximum ${MAX_GUESTS} guests reached for this session.`);
      }

      updateAuthorityUI();
      // Re-render only on real changes so in-progress drawer input isn't wiped.
      if (currentDrawerTab && JSON.stringify(sessionRoles) !== previousRoles) renderDrawer(currentDrawerTab);
    }

    function localSessionId() {
      return callFrame ? callFrame.participants().local.session_id : null;
    }

    function myRole() {
      const myId = localSessionId();
      if (sessionRoles.director && sessionRoles.director.id === myId) return 'Director';
      if (sessionRoles.coDirector && sessionRoles.coDirector.id === myId) return 'Co-Director';
      return 'Guest';
    }

    function isPrivileged(sessionId) {
      return (
        (sessionRoles.director && sessionRoles.director.id === sessionId) ||
        (sessionRoles.coDirector && sessionRoles.coDirector.id === sessionId)
      );
    }

    function privilegedIds() {
      return [sessionRoles.director, sessionRoles.coDirector].filter(Boolean).map((r) => r.id);
    }

    function handleMeetingJoined() {
      refreshRoles();
      syncLocalMediaState();
    }

    function handleParticipantUpdated(evt) {
      refreshRoles();
      if (evt && evt.participant && evt.participant.local) syncLocalMediaState();
    }

    function updateAuthorityUI() {
      const dirBadge = document.getElementById('director-badge');
      const coDirBadge = document.getElementById('co-director-badge');

      dirBadge.classList.toggle('hidden', !sessionRoles.director);
      document.getElementById('director-name').innerText = sessionRoles.director ? sessionRoles.director.name : 'Vacant';
      coDirBadge.classList.toggle('hidden', !sessionRoles.coDirector);
      document.getElementById('co-director-name').innerText = sessionRoles.coDirector ? sessionRoles.coDirector.name : 'Vacant';

      document.getElementById('guest-count').innerText = `${Math.min(sessionRoles.guests.length, MAX_GUESTS)}/${MAX_GUESTS}`;
      document.getElementById('current-user-role-label').innerText = callFrame
        ? `${localUserName} (${myRole()})`
        : 'Ready';
    }

    // --- Media controls ---

    function setControlState(btnId, iconName, isAlert, alertClass) {
      const btn = document.getElementById(btnId);
      btn.classList.toggle(alertClass, isAlert);
      btn.classList.toggle('bg-[#3c4043]', !isAlert);
      btn.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;
    }

    function renderMediaButtons() {
      setControlState('btn-mic', isAudioMuted ? 'mic-off' : 'mic', isAudioMuted, 'bg-red-600');
      setControlState('btn-cam', isVideoMuted ? 'video-off' : 'video', isVideoMuted, 'bg-red-600');
      setControlState('btn-share', 'screen-share', isScreenSharing, 'bg-sky-600');
      if (window.lucide) lucide.createIcons();
    }

    // Keeps our buttons in sync with changes made inside the Daily frame.
    function syncLocalMediaState() {
      if (!callFrame) return;
      const local = callFrame.participants().local;
      const screenState = local && local.tracks && local.tracks.screenVideo && local.tracks.screenVideo.state;
      isAudioMuted = !callFrame.localAudio();
      isVideoMuted = !callFrame.localVideo();
      isScreenSharing = !!screenState && screenState !== 'off' && screenState !== 'blocked';
      renderMediaButtons();
    }

    function toggleAudio() {
      if (!callFrame) return;
      isAudioMuted = !isAudioMuted;
      callFrame.setLocalAudio(!isAudioMuted);
      renderMediaButtons();
    }

    function toggleVideo() {
      if (!callFrame) return;
      isVideoMuted = !isVideoMuted;
      callFrame.setLocalVideo(!isVideoMuted);
      renderMediaButtons();
    }

    function toggleScreenShare() {
      if (!callFrame) return;
      // State updates arrive via participant-updated (the user may cancel the picker).
      if (isScreenSharing) {
        callFrame.stopScreenShare();
      } else {
        callFrame.startScreenShare();
      }
    }

    async function leaveMeeting() {
      isLeaving = true;
      if (callFrame) {
        try {
          await callFrame.leave();
        } catch (e) {
          // leaving anyway
        }
      }
      returnToHub();
    }

    // --- Forms & polls (app messages) ---

    function handleAppMessage(evt) {
      const msg = evt.data || {};
      const fromId = evt.fromId;

      if (msg.type === 'PUSH_FORM' && isPrivileged(fromId) && msg.form && Array.isArray(msg.form.fields)) {
        activeForm = { title: String(msg.form.title), fields: msg.form.fields.map(String) };
        displayBroadcastPopup('Form Received: ' + activeForm.title, `
          <p class="text-xs text-zinc-300 font-light mb-2">Fill out before continuing shoot:</p>
          <div class="space-y-2">
            ${activeForm.fields.map((f, i) => `<input type="text" data-form-field="${i}" placeholder="${escapeHtml(f)}" class="w-full bg-[#1e1f22] border border-white/10 rounded-lg p-2 text-xs text-white">`).join('')}
            <button onclick="submitFormResponse()" class="w-full py-2 bg-sky-500 rounded-lg text-xs font-medium text-white">Submit to Director</button>
          </div>
        `);
      } else if (msg.type === 'PUSH_POLL' && isPrivileged(fromId) && msg.poll && Array.isArray(msg.poll.options)) {
        activePoll = { id: String(msg.poll.id), question: String(msg.poll.question), options: msg.poll.options.map(String) };
        displayBroadcastPopup('Live Poll', `
          <p class="text-sm font-medium text-white mb-2">${escapeHtml(activePoll.question)}</p>
          <div class="space-y-1.5">
            ${activePoll.options.map((opt, i) => `
              <button onclick="votePoll(${i})" class="w-full text-left p-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-200 border border-white/5">
                ${escapeHtml(opt)}
              </button>
            `).join('')}
          </div>
        `);
      } else if (msg.type === 'FORM_RESPONSE' && isPrivileged(localSessionId()) && Array.isArray(msg.answers)) {
        const sender = callFrame.participants()[fromId];
        formResponses.push({
          from: (sender && sender.user_name) || 'Guest',
          title: String(msg.title),
          answers: msg.answers.map((a) => ({ field: String(a.field), value: String(a.value) }))
        });
        if (currentDrawerTab === 'forms') renderDrawer('forms');
      } else if (msg.type === 'POLL_VOTE' && myPoll && msg.pollId === myPoll.id) {
        const index = Number(msg.optionIndex);
        if (Number.isInteger(index) && index >= 0 && index < myPoll.options.length) {
          myPoll.votes[fromId] = index;
          if (currentDrawerTab === 'polls') renderDrawer('polls');
        }
      }
    }

    function displayBroadcastPopup(badge, innerHtml) {
      const popup = document.getElementById('broadcast-popup');
      document.getElementById('popup-badge').innerText = badge;
      document.getElementById('popup-content').innerHTML = innerHtml;
      popup.classList.remove('hidden');
      lucide.createIcons();
    }

    function hideBroadcastPopup() {
      document.getElementById('broadcast-popup').classList.add('hidden');
    }

    function submitFormResponse() {
      if (!activeForm || !callFrame) return;
      const answers = activeForm.fields.map((field, i) => ({
        field,
        value: document.querySelector(`[data-form-field="${i}"]`).value.trim()
      }));
      const recipients = privilegedIds().filter((id) => id !== localSessionId());
      if (recipients.length) {
        callFrame.sendAppMessage({ type: 'FORM_RESPONSE', title: activeForm.title, answers }, recipients);
      }
      activeForm = null;
      hideBroadcastPopup();
      alert("Form answers submitted.");
    }

    function votePoll(optionIndex) {
      if (!activePoll || !callFrame) return;
      const recipients = privilegedIds().filter((id) => id !== localSessionId());
      if (recipients.length) {
        callFrame.sendAppMessage({ type: 'POLL_VOTE', pollId: activePoll.id, optionIndex }, recipients);
      }
      const choice = activePoll.options[optionIndex];
      activePoll = null;
      hideBroadcastPopup();
      alert(`Vote registered for: ${choice}`);
    }

    // --- Side drawer ---

    function toggleDrawer(tab) {
      const drawer = document.getElementById('side-drawer');
      if (!tab || currentDrawerTab === tab) {
        drawer.classList.add('hidden');
        currentDrawerTab = null;
        return;
      }

      currentDrawerTab = tab;
      drawer.classList.remove('hidden');
      renderDrawer(tab);
    }

    function restrictedNotice(what) {
      return `<p class="text-xs text-zinc-400 font-light">Only the Director or Co-Director can ${what}.</p>`;
    }

    function renderDrawer(tab) {
      const title = document.getElementById('drawer-title');
      const body = document.getElementById('drawer-body');
      const canManage = !!callFrame && isPrivileged(localSessionId());

      if (tab === 'forms') {
        title.innerText = 'Pre-made Production Forms';
        body.innerHTML = !canManage ? restrictedNotice('push forms') : `
          <div class="space-y-4">
            <p class="text-xs text-zinc-400 font-light">Push forms directly to all participants:</p>
            ${productionForms.map((f, i) => `
              <div class="p-4 rounded-xl bg-white/5 border border-white/5 space-y-2">
                <h4 class="text-xs font-semibold text-white">${escapeHtml(f.title)}</h4>
                <p class="text-[11px] text-zinc-400">${f.fields.length} checklist fields</p>
                <button onclick="broadcastForm(${i})" class="w-full py-1.5 bg-white text-black text-xs rounded-lg font-medium hover:bg-zinc-200 transition-colors">
                  Push Form to Team
                </button>
              </div>
            `).join('')}
            <div class="pt-2 border-t border-white/10 space-y-2">
              <span class="block text-xs font-mono text-zinc-400">RESPONSES (${formResponses.length})</span>
              ${formResponses.length ? formResponses.map((r) => `
                <div class="p-3 rounded-xl bg-white/5 border border-white/5 space-y-1">
                  <p class="text-xs text-white font-medium">${escapeHtml(r.from)} <span class="text-zinc-500 font-light">· ${escapeHtml(r.title)}</span></p>
                  ${r.answers.map((a) => `<p class="text-[11px] text-zinc-400"><span class="text-zinc-500">${escapeHtml(a.field)}:</span> ${escapeHtml(a.value || '-')}</p>`).join('')}
                </div>
              `).join('') : '<p class="text-[11px] text-zinc-500">No responses yet.</p>'}
            </div>
          </div>
        `;
      } else if (tab === 'polls') {
        title.innerText = 'Launch Quick Poll';
        body.innerHTML = !canManage ? restrictedNotice('launch polls') : `
          <div class="space-y-3">
            <label class="block text-xs font-mono text-zinc-400">POLL QUESTION</label>
            <input type="text" id="poll-q" placeholder="e.g., Approve Take 4?" class="w-full bg-[#1e1f22] border border-white/10 rounded-lg p-2.5 text-xs text-white">

            <label class="block text-xs font-mono text-zinc-400 mt-2">OPTIONS (COMMA-SEPARATED)</label>
            <input type="text" id="poll-opts" placeholder="Yes, No, Needs Recut" class="w-full bg-[#1e1f22] border border-white/10 rounded-lg p-2.5 text-xs text-white">

            <button onclick="broadcastQuickPoll()" class="w-full mt-4 py-2.5 bg-sky-500 hover:bg-sky-400 text-white rounded-lg text-xs font-medium transition-colors">
              Broadcast Poll Now
            </button>
            ${myPoll ? renderPollResults() : ''}
          </div>
        `;
      } else if (tab === 'roster') {
        title.innerText = 'Role Management';
        body.innerHTML = `
          <div class="space-y-3 text-xs">
            <div class="p-3 bg-white/5 rounded-xl border border-white/5">
              <span class="text-zinc-500 font-mono block text-[10px]">DIRECTOR (MAX 1)</span>
              <span class="text-white font-medium">${sessionRoles.director ? escapeHtml(sessionRoles.director.name) : 'None'}</span>
            </div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/5">
              <span class="text-zinc-500 font-mono block text-[10px]">CO-DIRECTOR (MAX 1)</span>
              <span class="text-white font-medium">${sessionRoles.coDirector ? escapeHtml(sessionRoles.coDirector.name) : 'None'}</span>
            </div>
            <div class="p-3 bg-white/5 rounded-xl border border-white/5">
              <span class="text-zinc-500 font-mono block text-[10px]">GUESTS (MAX ${MAX_GUESTS})</span>
              <span class="text-white font-medium">${escapeHtml(sessionRoles.guests.map((g) => g.name).join(', ')) || 'No guests present'}</span>
            </div>
          </div>
        `;
      }
      lucide.createIcons();
    }

    function renderPollResults() {
      const counts = myPoll.options.map(() => 0);
      Object.values(myPoll.votes).forEach((i) => { counts[i]++; });
      const total = counts.reduce((a, b) => a + b, 0);
      return `
        <div class="pt-4 mt-2 border-t border-white/10 space-y-2">
          <span class="block text-xs font-mono text-zinc-400">LIVE RESULTS (${total} ${total === 1 ? 'vote' : 'votes'})</span>
          <p class="text-xs text-white font-medium">${escapeHtml(myPoll.question)}</p>
          ${myPoll.options.map((opt, i) => {
            const pct = total ? Math.round((counts[i] / total) * 100) : 0;
            return `
              <div class="space-y-1">
                <div class="flex justify-between text-[11px] text-zinc-300"><span>${escapeHtml(opt)}</span><span>${counts[i]}</span></div>
                <div class="h-1.5 rounded-full bg-white/10 overflow-hidden"><div class="h-full bg-sky-500" style="width: ${pct}%"></div></div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function broadcastForm(index) {
      if (!callFrame || !isPrivileged(localSessionId())) return;
      const selectedForm = productionForms[index];
      callFrame.sendAppMessage({ type: 'PUSH_FORM', form: selectedForm }, '*');
      alert(`Broadcasting '${selectedForm.title}' to everyone in call!`);
    }

    function broadcastQuickPoll() {
      if (!callFrame || !isPrivileged(localSessionId())) return;
      const q = document.getElementById('poll-q').value.trim();
      const opts = document.getElementById('poll-opts').value.split(',').map(s => s.trim()).filter(Boolean);

      if (!q || opts.length < 2) {
        alert("Please enter a question and at least 2 comma-separated options.");
        return;
      }

      myPoll = { id: Date.now().toString(36), question: q, options: opts, votes: {} };
      callFrame.sendAppMessage({
        type: 'PUSH_POLL',
        poll: { id: myPoll.id, question: q, options: opts }
      }, '*');
      renderDrawer('polls');
    }

    function prefillUserName() {
      const user = window.getChowaniecUser();
      const nameInput = document.getElementById('user-name-input');
      if (user && user.name !== 'Guest' && !nameInput.value) {
        nameInput.value = user.name;
      }
    }

    // Required hook for auth-gate.js
    window.initializeProtectedContent = function() {
      parseMeetingCodeFromUrl();
      prefillUserName();
      if (window.lucide) lucide.createIcons();
    };

    window.addEventListener('DOMContentLoaded', () => {
      parseMeetingCodeFromUrl();
      if (window.lucide) lucide.createIcons();
      if (window.isAppAuthorized && window.isAppAuthorized()) {
        window.initializeProtectedContent();
      }
    });
  </script>
</body>
</html>
