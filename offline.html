<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <title>Chowaniec - Offline</title>
  <!-- theme.css / theme.js / design.css are saved by the service worker, so the person's theme still applies offline.
       Everything below also has its own fallbacks in case they aren't cached yet. -->
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      background: var(--page-bg, var(--bg, #fafafa)); background-color: var(--bg, #fafafa); color: var(--text, #0a0a0a);
      font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; position: relative; isolation: isolate; overflow-x: hidden; }
    .glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .glow i { position: absolute; border-radius: 50%; filter: blur(64px); opacity: .45; }
    .glow i:nth-child(1) { width: 360px; height: 360px; left: -120px; top: -140px; background: color-mix(in srgb, var(--accent, #7c3aed) 30%, transparent); }
    .glow i:nth-child(2) { width: 300px; height: 300px; right: -120px; bottom: -100px; background: color-mix(in srgb, var(--accent, #7c3aed) 16%, #93c5fd 20%); }
    .card { width: 100%; max-width: 400px; padding: 32px 24px 28px; text-align: center; border-radius: 28px;
      background: color-mix(in srgb, var(--surface, #fff) 84%, transparent); -webkit-backdrop-filter: saturate(1.7) blur(22px); backdrop-filter: saturate(1.7) blur(22px);
      border: 1px solid color-mix(in srgb, var(--text, #000) 9%, transparent);
      box-shadow: 0 2px 4px rgba(17,17,26,.04), 0 12px 24px -6px rgba(17,17,26,.10), 0 30px 60px -18px rgba(17,17,26,.18); }
    .ic { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--accent-ink, #fff);
      background: linear-gradient(150deg, color-mix(in srgb, var(--accent, #0a0a0a) 72%, #fff), var(--accent, #0a0a0a));
      box-shadow: inset 0 -2px 0 rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.3), 0 12px 24px -10px color-mix(in srgb, var(--accent, #0a0a0a) 70%, transparent); }
    .ic svg { width: 30px; height: 30px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 30px; letter-spacing: -.015em; line-height: 1.1; margin: 0 0 10px; }
    p { color: var(--muted, #6b6b73); line-height: 1.5; margin: 0 0 22px; font-size: 15px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px; cursor: pointer;
      background: var(--accent, #0a0a0a); color: var(--accent-ink, #fff); font: 600 15px/1 inherit; font-family: inherit;
      box-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 6px 16px -6px color-mix(in srgb, var(--accent, #0a0a0a) 55%, transparent); transition: transform .2s cubic-bezier(.34,1.4,.5,1); }
    button:active { transform: scale(.96); }
    button svg { width: 18px; height: 18px; }
    button:focus-visible, #saved a:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--surface, #fff), 0 0 0 4px color-mix(in srgb, var(--accent, #0a0a0a) 70%, transparent); }
    #saved-title { margin: 26px 0 10px; font-size: 13.5px; font-weight: 600; color: var(--muted, #6b6b73); }
    #saved { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    #saved a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line, rgba(0,0,0,.1)); background: var(--surface-2, #f4f4f5); color: inherit; text-decoration: none; font-size: 14px; font-weight: 500; }
    #saved a:hover { background: var(--surface-3, #e9e9eb); }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme]) body { background: #0e0e11; color: #f4f4f5; }
      html:not([data-theme]) .card { background: rgba(26,26,29,.84); border-color: rgba(255,255,255,.1); }
      html:not([data-theme]) p, html:not([data-theme]) #saved-title { color: #a8a8b0; }
      html:not([data-theme]) button, html:not([data-theme]) .ic { background: #f2f2f3; color: #111; }
      html:not([data-theme]) #saved a { background: #222226; border-color: #33333a; }
    }
    @media (prefers-reduced-motion: no-preference) { .card { animation: in .5s cubic-bezier(.22,1,.36,1) both; } }
    @keyframes in { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"><i></i><i></i></div>
  <main class="card">
    <div class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M5 12.86a10 10 0 0 1 5.17-2.69M19 12.86a10 10 0 0 0-2.01-1.53M2 8.82a15 15 0 0 1 4.18-2.65M22 8.82a15 15 0 0 0-11.29-3.76M2 2l20 20"/></svg></div>
    <h1>You're offline</h1>
    <p>Chowaniec needs an internet connection for this page. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5"/></svg>Try again</button>
    <p id="saved-title" hidden>These work offline on this device</p>
    <ul id="saved" aria-labelledby="saved-title"></ul>
  </main>
  <script>
    // Pages the app saved for offline use (see /sw.js): chats and notes you've opened can still be read.
    (async function () {
      if (!window.caches) return;
      const names = { '/': 'Home', '/group/': 'Group Chat', '/messages/': 'Messages', '/notes/': 'Notes', '/calendar/': 'Calendar', '/lists/': 'Lists', '/games/': 'Games', '/ai/': 'AI', '/settings/': 'Settings', '/watch/': 'Watch', '/trophies/': 'Trophies' };
      const found = [];
      for (const path of Object.keys(names)) if (await caches.match(path, { ignoreSearch: true })) found.push(path);
      if (!found.length) return;
      document.getElementById('saved-title').hidden = false;
      document.getElementById('saved').innerHTML = found.map((p) => '<li><a href="' + p + '">' + names[p] + '</a></li>').join('');
    })();
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
