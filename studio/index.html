<!DOCTYPE html>
<html lang="en" class="ch-ui ch-refresh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Studio</title>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/design.css">
    <link rel="stylesheet" href="/design-extra.css">
    <script src="/theme.js"></script>

    <script src="/pwa.js" defer></script>
    <!-- Tailwind is only used by the shared passcode box -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script src="../passwords.js"></script>
    <script src="../auth-gate.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
    <link rel="stylesheet" href="/studio/studio.css">
    <script src="/studio/store.js" defer></script>
    <script src="/studio/camera.js" defer></script>
    <script src="/studio/gestures.js" defer></script>
    <script src="/studio/export.js" defer></script>
    <script src="/studio/studio.js" defer></script>
</head>
<body>
<div id="app-root">
    <div class="ch-glow" aria-hidden="true"><i></i><i></i><i></i></div>
    <header class="ch-header" id="st-header">
        <div class="ch-header__bar">
            <a class="ch-iconbtn" href="/" id="st-back" aria-label="Back to home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m15 18-6-6 6-6"/></svg></a>
            <span class="ch-header__small" id="st-small" aria-hidden="true">Studio</span>
            <div class="ch-header__actions" id="st-actions"></div>
        </div>
        <h1 class="ch-header__title" id="st-title">Studio</h1>
        <p class="ch-header__sub" id="st-sub">Shoot scenes, review every take, export in order.</p>
    </header>
    <main class="ch-page ch-page--narrow st-main" id="main" aria-live="polite">
        <div class="ch-skel" style="height:140px;margin-top:16px"></div>
    </main>
</div>

<!-- Full-screen camera -->
<div class="cam" id="cam" hidden data-state="off" role="dialog" aria-modal="true" aria-label="Camera">
    <div class="cam-stage" id="cam-stage">
        <video class="cam-video" id="cam-video" playsinline muted autoplay></video>
        <div class="cam-frame" id="cam-frame" aria-hidden="true">
            <div class="cam-grid"><i></i><i></i><i></i><i></i></div>
            <div class="cam-guides"><div class="cam-guides__title"></div><div class="cam-guides__action"></div><div class="cam-guides__ui-top"></div><div class="cam-guides__ui-bottom"></div><div class="cam-guides__ui-side"></div></div>
            <div class="cam-focus" id="cam-focus"></div>
            <div class="cam-recborder"></div>
        </div>
    </div>
    <div class="cam-ui" id="cam-ui"></div>
</div>

<!-- Player (library + play all) -->
<div class="player" id="player" hidden role="dialog" aria-modal="true" aria-labelledby="player-title"></div>

<!-- Generic sheet (export, paste list, confirm) -->
<div class="ch-sheet st-sheet" id="st-sheet" role="dialog" aria-modal="true" aria-labelledby="st-sheet-title" hidden>
    <div class="ch-sheet__panel"><div class="ch-sheet__handle"></div><div id="st-sheet-body"></div></div>
</div>

<div class="st-toast" id="st-toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
