<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <script src="/pwa.js" defer></script>
    <title>Chowaniec Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@1.55.0/dist/umd/lucide.min.js"></script>
    <script src="../passwords.js"></script>
    <script src="../auth-gate.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #fafafa; color: #111827; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .gone { display: none !important; }
        .hit { display: block; background: #fff; border: 1px solid #f3f4f6; border-radius: 18px; padding: 14px 16px; text-decoration: none; color: inherit; }
        .hit:hover { border-color: #d1d5db; }
        .hit mark { background: #fde68a; border-radius: 3px; padding: 0 1px; }
        .spin { animation: spin 1s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center gap-3">
            <div class="w-8 h-8 shrink-0 bg-black rounded-full flex items-center justify-center text-white text-xs">CN</div>
            <div class="font-serif tracking-wide text-xl whitespace-nowrap">Chowaniec <span class="text-gray-400 italic font-light text-base">Search</span></div>
        </div>
    </header>

    <main class="flex-1 max-w-3xl mx-auto px-4 py-6 pb-28 w-full space-y-6">
        <form id="form" role="search" class="flex gap-2">
            <label for="q" class="sr-only">Search everything</label>
            <input id="q" name="q" type="search" autocomplete="off" maxlength="100" class="flex-1 min-w-0 min-h-[50px] bg-white border border-gray-200 rounded-xl px-4 outline-none focus:border-black text-base">
            <button type="submit" class="shrink-0 min-h-[50px] px-6 rounded-xl bg-black text-white text-sm font-medium hover:bg-gray-800">Search</button>
        </form>
        <p id="status" class="text-xs font-mono uppercase tracking-widest text-gray-400" role="status" aria-live="polite"></p>
        <div id="results" class="space-y-8"></div>
    </main>

    <div id="signin-modal" class="gone fixed inset-0 bg-black/40 z-[80] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full text-center">
            <h3 class="font-serif text-xl mb-2">Please sign in again</h3>
            <button type="button" id="btn-signin" class="w-full min-h-[44px] bg-black text-white rounded-xl text-sm mt-3">Sign in again</button>
        </div>
    </div>

    <button onclick="returnToHub()" title="Return to Hub" class="fixed bottom-6 right-6 w-14 h-14 bg-white border border-gray-200 shadow-xl rounded-full flex items-center justify-center text-gray-600 hover:text-black z-50">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <script src="search.js"></script>
</body>
</html>
